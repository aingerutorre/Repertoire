<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>REPERTORIO</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #090a0c;
      --card: #121417;
      --card-border: #23272f;
      --text-main: #f3f4f6;
      --text-muted: #9ca3af;
      --accent: #38bdf8;
      --accent-muted: rgba(56, 189, 248, 0.15);
      --green: #4ade80;
      --amber: #fbbf24;
      --purple: #c084fc;
      --red: #f87171;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background-color: var(--bg);
      color: var(--text-main);
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      -webkit-font-smoothing: antialiased;
    }
    .mono { font-family: 'JetBrains Mono', monospace; }

    header {
      border-bottom: 1px solid var(--card-border);
      background-color: rgba(9, 10, 12, 0.95);
      position: sticky;
      top: 0;
      z-index: 30;
      backdrop-filter: blur(8px);
      padding: 0.75rem 1rem;
    }
    .header-inner {
      max-width: 1100px;
      margin: 0 auto;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 0.75rem;
    }
    .brand-left {
      display: flex;
      align-items: center;
      gap: 1rem;
      flex-wrap: wrap;
    }
    .brand-title {
      font-size: 1.15rem;
      font-weight: 800;
      letter-spacing: 0.08em;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }
    .badge-count {
      font-size: 0.75rem;
      padding: 0.15rem 0.5rem;
      border-radius: 9999px;
      background: var(--card-border);
      color: var(--text-muted);
    }

    /* Navegación de pestañas */
    .nav-tabs {
      display: inline-flex;
      background: #14171d;
      border: 1px solid var(--card-border);
      border-radius: 6px;
      padding: 0.2rem;
      gap: 0.2rem;
    }
    .nav-tab {
      padding: 0.35rem 0.75rem;
      font-size: 0.78rem;
      font-weight: 600;
      border-radius: 4px;
      border: none;
      background: transparent;
      color: var(--text-muted);
      cursor: pointer;
      transition: all 0.15s ease;
    }
    .nav-tab.active {
      background: var(--accent-muted);
      color: var(--accent);
    }

    .btn-group { display: flex; gap: 0.45rem; align-items: center; flex-wrap: wrap; }
    .btn {
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      padding: 0.4rem 0.7rem;
      border-radius: 6px;
      font-size: 0.75rem;
      font-weight: 600;
      cursor: pointer;
      border: 1px solid var(--card-border);
      background: var(--card);
      color: var(--text-main);
      transition: all 0.15s ease;
      touch-action: manipulation;
    }
    .btn:hover { background: #1c2027; border-color: #3b4252; }
    .btn-primary { background: var(--accent); color: #000; border-color: var(--accent); }
    .btn-primary:hover { opacity: 0.9; }
    .btn-drive { background: #1e293b; color: #38bdf8; border-color: rgba(56, 189, 248, 0.4); }
    .btn-drive:hover { background: #283548; }

    main {
      flex: 1;
      max-width: 1100px;
      width: 100%;
      margin: 0 auto;
      padding: 1rem;
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }

    .toolbar { display: flex; flex-direction: column; gap: 0.75rem; }
    .search-row { display: flex; gap: 0.5rem; }
    .input-text {
      flex: 1;
      background: var(--card);
      border: 1px solid var(--card-border);
      color: var(--text-main);
      padding: 0.55rem 0.85rem;
      border-radius: 6px;
      font-size: 0.85rem;
      outline: none;
      font-family: inherit;
    }
    .input-text:focus { border-color: var(--accent); }
    textarea.input-text {
      resize: vertical;
      min-height: 85px;
      line-height: 1.45;
    }

    .filter-chips { display: flex; flex-wrap: wrap; gap: 0.4rem; }
    .chip {
      padding: 0.35rem 0.65rem;
      font-size: 0.72rem;
      font-weight: 600;
      border-radius: 6px;
      background: var(--card);
      color: var(--text-muted);
      border: 1px solid var(--card-border);
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      touch-action: manipulation;
    }
    .chip.active {
      background: var(--accent-muted);
      color: var(--accent);
      border-color: var(--accent);
    }

    .roulette-panel {
      background: var(--card);
      border: 1px solid var(--card-border);
      border-radius: 8px;
      padding: 0.9rem 1rem;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 0.75rem;
    }

    .standards-list { display: flex; flex-direction: column; gap: 0.5rem; }
    .standard-card {
      background: var(--card);
      border: 1px solid var(--card-border);
      border-radius: 6px;
      padding: 0.65rem 0.85rem;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 0.5rem;
      cursor: pointer;
    }
    .standard-card:hover { border-color: #3b4252; }
    .card-info {
      display: flex;
      flex-direction: column;
      gap: 0.25rem;
      flex: 1;
      min-width: 200px;
    }
    .card-title {
      font-size: 0.92rem;
      font-weight: 700;
      color: #fff;
      display: flex;
      align-items: center;
      gap: 0.4rem;
    }
    .card-meta {
      font-size: 0.72rem;
      color: var(--text-muted);
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 0.4rem;
    }
    .card-notes-preview {
      font-size: 0.76rem;
      color: #94a3b8;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 520px;
      margin-top: 0.1rem;
    }
    .card-actions { display: flex; align-items: center; gap: 0.35rem; }
    .level-btn {
      width: 28px;
      height: 28px;
      border-radius: 4px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 0.72rem;
      font-weight: 700;
      border: 1px solid var(--card-border);
      background: #181b20;
      color: var(--text-muted);
      cursor: pointer;
      touch-action: manipulation;
    }
    .level-btn:hover { background: #23272f; }
    .level-btn.active-0 { background: #374151; color: #fff; border-color: #4b5563; }
    .level-btn.active-1 { background: #1e3a8a; color: #93c5fd; border-color: #3b82f6; }
    .level-btn.active-2 { background: #581c87; color: #d8b4fe; border-color: #a855f7; }
    .level-btn.active-3 { background: #854d0e; color: #fde047; border-color: #eab308; }
    .level-btn.active-4 { background: #064e3b; color: #6ee7b7; border-color: #10b981; }

    /* Tarjetas de Técnica / Lenguaje */
    .workshop-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
      gap: 0.85rem;
    }
    .wk-card {
      background: var(--card);
      border: 1px solid var(--card-border);
      border-radius: 8px;
      padding: 0.9rem;
      display: flex;
      flex-direction: column;
      gap: 0.6rem;
      justify-content: space-between;
    }
    .wk-card:hover { border-color: #3b4252; }
    .wk-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 0.5rem;
    }
    .wk-badge {
      font-size: 0.65rem;
      font-weight: 700;
      text-transform: uppercase;
      padding: 0.15rem 0.45rem;
      border-radius: 4px;
      letter-spacing: 0.04em;
    }
    .wk-badge.technique { background: rgba(251, 191, 36, 0.15); color: var(--amber); border: 1px solid rgba(251, 191, 36, 0.3); }
    .wk-badge.language { background: rgba(192, 132, 252, 0.15); color: var(--purple); border: 1px solid rgba(192, 132, 252, 0.3); }
    .wk-tags {
      display: flex;
      flex-wrap: wrap;
      gap: 0.3rem;
    }
    .wk-tag {
      font-size: 0.68rem;
      background: #1a1e26;
      color: var(--accent);
      padding: 0.1rem 0.4rem;
      border-radius: 4px;
      font-family: 'JetBrains Mono', monospace;
    }
    .wk-body {
      font-size: 0.8rem;
      color: #cbd5e1;
      white-space: pre-line;
      line-height: 1.45;
    }
    .wk-img-wrap {
      background: #f8fafc;
      border-radius: 6px;
      padding: 0.35rem;
      cursor: zoom-in;
      overflow: hidden;
      border: 1px solid var(--card-border);
    }
    .wk-img-wrap img {
      width: 100%;
      height: auto;
      display: block;
      border-radius: 3px;
    }

    /* Zona de pegado de captura en Modal */
    .paste-zone {
      border: 1px dashed #3b4252;
      background: #0f1115;
      border-radius: 6px;
      padding: 0.85rem;
      text-align: center;
      font-size: 0.78rem;
      color: var(--text-muted);
      cursor: pointer;
      transition: border-color 0.15s;
    }
    .paste-zone:hover, .paste-zone.dragover {
      border-color: var(--accent);
      color: var(--text-main);
    }
    .paste-preview {
      max-height: 180px;
      max-width: 100%;
      border-radius: 4px;
      margin-top: 0.5rem;
      border: 1px solid var(--card-border);
    }

    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.8);
      backdrop-filter: blur(4px);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 50;
      padding: 1rem;
      overflow-y: auto;
    }
    .modal-card {
      background: #16191f;
      border: 1px solid var(--card-border);
      border-radius: 8px;
      max-width: 520px;
      width: 100%;
      padding: 1.25rem;
      display: flex;
      flex-direction: column;
      gap: 0.85rem;
      margin: auto;
    }

    footer {
      border-top: 1px solid var(--card-border);
      padding: 1rem;
      text-align: center;
      font-size: 0.75rem;
      color: var(--text-muted);
      display: flex;
      justify-content: center;
      gap: 1rem;
    }
  </style>
</head>
<body>

  <header>
    <div class="header-inner">
      <div class="brand-left">
        <div class="brand-title mono">
          REPERTORIO
          <span id="total-badge" class="badge-count">0</span>
          <span id="sync-indicator" style="font-size:0.68rem; color:var(--text-muted); font-weight:400; opacity:0.85;"></span>
        </div>
        <div class="nav-tabs">
          <button id="tab-repertoire" class="nav-tab active" onclick="switchTab('repertoire')">🎷 Standards</button>
          <button id="tab-workshop" class="nav-tab" onclick="switchTab('workshop')">📚 Técnica / Lenguaje</button>
        </div>
      </div>

      <div class="btn-group">
        <button id="btn-save-drive" class="btn btn-drive" onclick="saveToDrive()">☁️ Guardar en Drive</button>
        <button id="btn-load-drive" class="btn btn-drive" onclick="loadFromDrive()">☁️ Cargar de Drive</button>
      </div>
    </div>
  </header>

  <!-- VISTA 1: REPERTORIO DE STANDARDS -->
  <main id="view-repertoire">
    <section class="toolbar">
      <div class="search-row">
        <input type="text" id="search-input" class="input-text" placeholder="Buscar standard, tonalidad o palabra clave en notas..." oninput="filterStandards()">
        <button class="btn btn-primary" onclick="openNewModal()">+ Standard</button>
      </div>

      <div class="filter-chips">
        <button class="chip active" onclick="setFilter('all', this)">Todos <span id="count-all" class="mono">0</span></button>
        <button class="chip" onclick="setFilter('pending', this)">F0: Pendientes <span id="count-0" class="mono">0</span></button>
        <button class="chip" onclick="setFilter('melody', this)">F1: Melodía <span id="count-1" class="mono">0</span></button>
        <button class="chip" onclick="setFilter('harmony', this)">F2: Armonía <span id="count-2" class="mono">0</span></button>
        <button class="chip" onclick="setFilter('maturation', this)">F3: Maduración <span id="count-3" class="mono">0</span></button>
        <button class="chip" onclick="setFilter('assimilated', this)">✓ Asimilados <span id="count-4" class="mono">0</span></button>
        <button class="chip" onclick="setFilter('srs-due', this)">⚠️ Repasos SRS <span id="count-due" class="mono">0</span></button>
      </div>
    </section>

    <section class="roulette-panel">
      <div>
        <div style="font-weight:700; font-size:0.85rem;">Práctica Aleatoria</div>
        <div style="font-size:0.72rem; color:var(--text-muted);">Sugerencia de estudio o jam en frío</div>
      </div>
      <div class="btn-group">
        <button class="btn" onclick="spinRoulette('study')">🎲 Fases 1-3</button>
        <button class="btn btn-primary" onclick="spinRoulette('cold')">⚡ En Frío (Asimilados)</button>
      </div>
    </section>

    <section id="roulette-box" style="display:none; background:#181b20; border:1px solid #38bdf8; border-radius:6px; padding:0.85rem;"></section>

    <section id="standards-container" class="standards-list"></section>
  </main>

  <!-- VISTA 2: TÉCNICA Y LENGUAJE -->
  <main id="view-workshop" style="display:none;">
    <section class="toolbar">
      <div class="search-row">
        <input type="text" id="wk-search-input" class="input-text" placeholder="Buscar ejercicio, acorde, etiqueta (ej. Terceras, II-V-I, 7alt)..." oninput="renderWorkshop()">
        <button class="btn btn-primary" onclick="openNewWorkshopModal()">+ Ficha Técnica / Frase</button>
      </div>

      <div class="filter-chips">
        <button class="chip active" onclick="setWkFilter('all', this)">Todo <span id="wk-count-all" class="mono">0</span></button>
        <button class="chip" onclick="setWkFilter('technique', this)">⚙️ Técnica <span id="wk-count-tech" class="mono">0</span></button>
        <button class="chip" onclick="setWkFilter('language', this)">🎷 Lenguaje / Frases <span id="wk-count-lang" class="mono">0</span></button>
      </div>
    </section>

    <section id="workshop-container" class="workshop-grid"></section>
  </main>

  <!-- MODAL: EDITAR / NUEVO STANDARD -->
  <div id="modal-overlay" class="modal-overlay" onclick="closeModalOnOutside(event, 'modal-overlay')">
    <div class="modal-card">
      <div style="font-weight:700; font-size:1.05rem;" id="modal-title">Editar Standard</div>
      <input type="hidden" id="edit-id">
      <div>
        <label style="font-size:0.75rem; color:var(--text-muted); display:block; margin-bottom:0.25rem;">Título</label>
        <input type="text" id="edit-name" class="input-text" style="width:100%;">
      </div>
      <div style="display:grid; grid-template-columns:1fr 1fr; gap:0.5rem;">
        <div>
          <label style="font-size:0.75rem; color:var(--text-muted); display:block; margin-bottom:0.25rem;">Tonalidad</label>
          <input type="text" id="edit-key" class="input-text mono" style="width:100%;">
        </div>
        <div>
          <label style="font-size:0.75rem; color:var(--text-muted); display:block; margin-bottom:0.25rem;">Forma</label>
          <input type="text" id="edit-form" class="input-text mono" style="width:100%;">
        </div>
      </div>
      <div>
        <label style="font-size:0.75rem; color:var(--text-muted); display:block; margin-bottom:0.25rem;">Nivel de Asimilación</label>
        <select id="edit-level" class="input-text" style="width:100%;">
          <option value="pending">F0: Pendientes</option>
          <option value="melody">F1: Melodía</option>
          <option value="harmony">F2: Armonía</option>
          <option value="maturation">F3: Maduración</option>
          <option value="assimilated">✓ Asimilado</option>
        </select>
      </div>
      <div>
        <label style="font-size:0.75rem; color:var(--text-muted); display:block; margin-bottom:0.25rem;">Notas de estudio / Dificultades</label>
        <textarea id="edit-notes" class="input-text" style="width:100%;" placeholder="Ej: Puente en B mayor, enlace ii-V en compás 12..."></textarea>
      </div>
      <div style="display:flex; justify-content:space-between; margin-top:0.35rem;">
        <button class="btn" style="color:var(--red); border-color:rgba(248,113,113,0.3);" onclick="deleteCurrentStandard()">Eliminar</button>
        <div class="btn-group">
          <button class="btn" onclick="closeModal('modal-overlay')">Cancelar</button>
          <button class="btn btn-primary" onclick="saveStandard()">Guardar</button>
        </div>
      </div>
    </div>
  </div>

  <!-- MODAL: NUEVA / EDITAR FICHA DE TÉCNICA O LENGUAJE -->
  <div id="wk-modal-overlay" class="modal-overlay" onclick="closeModalOnOutside(event, 'wk-modal-overlay')">
    <div class="modal-card">
      <div style="font-weight:700; font-size:1.05rem;" id="wk-modal-title">Nueva Ficha de Estudio</div>
      <input type="hidden" id="wk-edit-id">
      <input type="hidden" id="wk-existing-url">

      <div style="display:grid; grid-template-columns:1fr 1fr; gap:0.5rem;">
        <div>
          <label style="font-size:0.75rem; color:var(--text-muted); display:block; margin-bottom:0.25rem;">Categoría</label>
          <select id="wk-edit-type" class="input-text" style="width:100%;">
            <option value="technique">⚙️ Técnica</option>
            <option value="language">🎷 Lenguaje / Frase</option>
          </select>
        </div>
        <div>
          <label style="font-size:0.75rem; color:var(--text-muted); display:block; margin-bottom:0.25rem;">Etiquetas / Armonía</label>
          <input type="text" id="wk-edit-tags" class="input-text mono" style="width:100%;" placeholder="Ej: II-V-I, 7alt, Cuatríadas">
        </div>
      </div>

      <div>
        <label style="font-size:0.75rem; color:var(--text-muted); display:block; margin-bottom:0.25rem;">Título / Concepto</label>
        <input type="text" id="wk-edit-title" class="input-text" style="width:100%;" placeholder="Ej: Terceras / Lick II-V-I menor">
      </div>

      <div>
        <label style="font-size:0.75rem; color:var(--text-muted); display:block; margin-bottom:0.25rem;">Indicaciones / Texto (opcional si adjuntas partitura)</label>
        <textarea id="wk-edit-notes" class="input-text" style="width:100%; min-height:70px;" placeholder="Ej: Enlazar por grados conjuntos en todas las tonalidades..."></textarea>
      </div>

      <div>
        <label style="font-size:0.75rem; color:var(--text-muted); display:block; margin-bottom:0.25rem;">Captura de partitura / ejercicio (opcional)</label>
        <div id="paste-zone" class="paste-zone" onclick="document.getElementById('wk-file-input').click()">
          <div>📋 Pega una captura aquí (<strong>Cmd + V</strong>) o haz clic para seleccionar imagen</div>
          <div id="wk-preview-container"></div>
        </div>
        <input type="file" id="wk-file-input" accept="image/*" style="display:none" onchange="handleImageFile(event)">
        <button id="btn-clear-img" class="btn" style="display:none; margin-top:0.4rem; font-size:0.7rem; color:var(--red);" onclick="clearWorkshopImage(event)">✕ Quitar imagen</button>
      </div>

      <div style="display:flex; justify-content:space-between; margin-top:0.35rem;">
        <button id="btn-wk-delete" class="btn" style="color:var(--red); border-color:rgba(248,113,113,0.3);" onclick="deleteCurrentWorkshop()">Eliminar</button>
        <div class="btn-group">
          <button class="btn" onclick="closeModal('wk-modal-overlay')">Cancelar</button>
          <button id="btn-wk-save" class="btn btn-primary" onclick="saveWorkshopItem()">Guardar Ficha</button>
        </div>
      </div>
    </div>
  </div>

  <!-- VISOR DE IMAGEN AMPLIADA -->
  <div id="lightbox-overlay" class="modal-overlay" onclick="closeModal('lightbox-overlay')" style="z-index:60;">
    <div style="max-width:95vw; max-height:92vh; background:#f8fafc; padding:0.5rem; border-radius:8px; box-shadow:0 20px 50px rgba(0,0,0,0.8);">
      <img id="lightbox-img" src="" style="max-width:100%; max-height:86vh; display:block; border-radius:4px;">
    </div>
  </div>

  <footer>
    <button class="btn" style="font-size:0.7rem; padding:0.25rem 0.5rem;" onclick="resetToDefaults()">Restablecer catálogo inicial</button>
  </footer>

  <script>
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzIBXnVD8tleVxzQVzBZQmUmgdPNQIFvXvmmhcwYl4X9JBRzQiJUsQiUUAmQj1henyq/exec";
    const STORAGE_KEY = "jazz_standards_vault_v5";
    const WORKSHOP_STORAGE_KEY = "jazz_workshop_vault_v1";
    const SYNC_STORAGE_KEY = "jazz_repertoire_last_sync";

    const INITIAL_CATALOG = [

    function escapeHTML(str) {
      if (!str) return "";
      return str
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
    }

      document.getElementById("tab-repertoire").classList.toggle("active", tab === "repertoire");

    function updateSyncTimestamp(timestampStr) {
      const el = document.getElementById("sync-indicator");
      if (!el) return;
      const val = timestampStr || localStorage.getItem(SYNC_STORAGE_KEY);
      el.textContent = val ? `• Sync: ${val}` : "";
    }

    function setSyncSuccess() {
      const now = new Date();
      const day = String(now.getDate()).padStart(2, '0');
      const month = String(now.getMonth() + 1).padStart(2, '0');
      const hours = String(now.getHours()).padStart(2, '0');
      const mins = String(now.getMinutes()).padStart(2, '0');
      const formatted = `${day}/${month} ${hours}:${mins}`;
      localStorage.setItem(SYNC_STORAGE_KEY, formatted);
      updateSyncTimestamp(formatted);
    }

    function init() {
      try {
        const saved = localStorage.getItem(STORAGE_KEY);
        if (saved) {
          const parsed = JSON.parse(saved);
          if (Array.isArray(parsed) && parsed.length > 0) {
            standards = parsed.map((s, idx) => ({
              id: s.id || `std_${idx}`,
              title: s.title || "Sin título",
              key: s.key || "",
              form: s.form || "AABA",
              level: ["pending", "melody", "harmony", "maturation", "assimilated"].includes(s.level) ? s.level : "pending",
              srsInterval: Number(s.srsInterval) || 15,
              nextReview: s.nextReview || null,
              notes: s.notes || ""
            }));
          } else {
            loadDefaults();
          }
        } else {
          loadDefaults();
        }

        const savedWk = localStorage.getItem(WORKSHOP_STORAGE_KEY);
        if (savedWk) {
          const parsedWk = JSON.parse(savedWk);
          if (Array.isArray(parsedWk)) workshop = parsedWk;
        }
      } catch (err) {
        console.error("Error cargando localStorage:", err);
        loadDefaults();
      }
      updateSyncTimestamp();
      render();
    }

    function loadDefaults() {
      standards = INITIAL_CATALOG.map((title, i) => ({
        id: "std_" + (i + 1),
        title: title,
        key: "",
        form: "AABA",
        level: "pending",
        srsInterval: 15,
        nextReview: null,
        notes: ""
      }));
      save();
    }

    function resetToDefaults() {
      if (confirm("¿Restablecer todo el repertorio al catálogo inicial?")) {
        loadDefaults();
        render();
      }
    }

    function save() {
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(standards));
        localStorage.setItem(WORKSHOP_STORAGE_KEY, JSON.stringify(workshop));
      } catch (e) {
        console.error("Error guardando en localStorage:", e);
      }
    }

    // --- SINCRONIZACIÓN CON GOOGLE DRIVE ---

    async function saveToDrive() {
      const btn = document.getElementById("btn-save-drive");
      const originalText = btn.innerHTML;
      btn.innerHTML = "⏳ Guardando...";
      btn.disabled = true;

      try {
        await fetch(SCRIPT_URL, {
          method: "POST",
          mode: "no-cors",
          headers: { "Content-Type": "text/plain;charset=utf-8" },
          body: JSON.stringify({
            action: "save_all",
            standards: standards,
            workshop: workshop
          })
        });

        setSyncSuccess();
        btn.innerHTML = "✓ Guardado";
        alert("Todo sincronizado en Drive:\n• JSON (Standards + Técnica/Lenguaje)\n• Repertorio.txt actualizado");
      } catch (err) {
        alert("Error al enviar a Drive: " + err.message);
      } finally {
        setTimeout(() => {
          btn.innerHTML = originalText;
          btn.disabled = false;
        }, 2000);
      }
    }

    async function loadFromDrive() {
      const btn = document.getElementById("btn-load-drive");
      const originalText = btn.innerHTML;
      btn.innerHTML = "⏳ Conectando...";
      btn.disabled = true;

      try {
        const urlConCacheBuster = SCRIPT_URL + (SCRIPT_URL.includes("?") ? "&" : "?") + "t=" + Date.now();
        const response = await fetch(urlConCacheBuster, { method: "GET" });
        const rawText = await response.text();

        let payload;
        try {
          payload = JSON.parse(rawText);
        } catch (e) {
          throw new Error("Respuesta no válida del servidor.");
        }

        if (payload && payload.status === "empty") {
          alert("No se encontró ningún archivo .json en tu carpeta de Drive.");
          return;
        }

        const rawData = payload.data || payload.standards || payload;
        let listaStandards = [];
        let listaWorkshop = [];
        let nombreArchivo = payload.fileName || "respaldo";

        if (Array.isArray(rawData)) {
          listaStandards = rawData;
        } else if (rawData && Array.isArray(rawData.standards)) {
          listaStandards = rawData.standards;
          listaWorkshop = Array.isArray(rawData.workshop) ? rawData.workshop : [];
        }

        if (listaStandards.length > 0) {
          if (confirm(`Se han localizado ${listaStandards.length} standards y ${listaWorkshop.length} fichas de Técnica/Lenguaje (${nombreArchivo}).\n¿Deseas sincronizar y actualizar este dispositivo?`)) {
            standards = listaStandards.map((s, idx) => ({
              id: s.id || `std_${idx}`,
              title: s.title || "Sin título",
              key: s.key || "",
              form: s.form || "AABA",
              level: ["pending", "melody", "harmony", "maturation", "assimilated"].includes(s.level) ? s.level : "pending",
              srsInterval: Number(s.srsInterval) || 15,
              nextReview: s.nextReview || null,
              notes: s.notes || ""
            }));
            workshop = listaWorkshop;
            save();
            render();
            renderWorkshop();
            setSyncSuccess();
            btn.innerHTML = "✓ Sincronizado";
          }
        } else {
          alert("El archivo de Drive no contiene datos válidos.");
        }

      } catch (err) {
        alert("Error al cargar desde Drive: " + err.message);
      } finally {
        setTimeout(() => {
          btn.innerHTML = originalText;
          btn.disabled = false;
        }, 2000);
      }
    }

    // --- LÓGICA DE STANDARDS ---

    function updateCounts() {
      const counts = { pending: 0, melody: 0, harmony: 0, maturation: 0, assimilated: 0, due: 0 };
      const today = new Date().toISOString().split('T')[0];

      standards.forEach(s => {
        if (counts[s.level] !== undefined) counts[s.level]++;
        if (s.level === 'assimilated' && s.nextReview && s.nextReview <= today) {
          counts.due++;
        }
      });

      document.getElementById("total-badge").textContent = standards.length;
      document.getElementById("count-all").textContent = standards.length;
      document.getElementById("count-0").textContent = counts.pending;
      document.getElementById("count-1").textContent = counts.melody;
      document.getElementById("count-2").textContent = counts.harmony;
      document.getElementById("count-3").textContent = counts.maturation;
      document.getElementById("count-4").textContent = counts.assimilated;
      document.getElementById("count-due").textContent = counts.due;
    }

    function setFilter(filter, el) {
      currentFilter = filter;
      document.querySelectorAll("#view-repertoire .chip").forEach(c => c.classList.remove("active"));
      if (el) el.classList.add("active");
      renderList();
    }

    function filterStandards() {
      renderList();
    }

    function setLevel(id, newLevel, e) {
      if (e) e.stopPropagation();
      const item = standards.find(s => s.id === id);
      if (!item) return;

      item.level = newLevel;
      if (newLevel === "assimilated" && !item.nextReview) {
        item.srsInterval = 15;
        const d = new Date();
        d.setDate(d.getDate() + 15);
        item.nextReview = d.toISOString().split('T')[0];
      }
      save();
      render();
    }

    function srsReview(id, status, e) {
      if (e) e.stopPropagation();
      const item = standards.find(s => s.id === id);
      if (!item) return;

      const d = new Date();
      if (status === "solid") {
        item.srsInterval = Math.round((item.srsInterval || 15) * 2);
        d.setDate(d.getDate() + item.srsInterval);
        item.nextReview = d.toISOString().split('T')[0];
      } else {
        item.level = "maturation";
        item.srsInterval = 7;
        d.setDate(d.getDate() + 7);
        item.nextReview = d.toISOString().split('T')[0];
      }
      save();
      render();
    }

    function renderList() {
      const container = document.getElementById("standards-container");
      if (!container) return;

      const search = (document.getElementById("search-input").value || "").toLowerCase().trim();
      const today = new Date().toISOString().split('T')[0];

      const filtered = standards.filter(s => {
        const matchesSearch =
          s.title.toLowerCase().includes(search) ||
          (s.key && s.key.toLowerCase().includes(search)) ||
          (s.notes && s.notes.toLowerCase().includes(search));
        if (!matchesSearch) return false;

        if (currentFilter === "all") return true;
        if (currentFilter === "srs-due") return s.level === "assimilated" && s.nextReview && s.nextReview <= today;
        return s.level === currentFilter;
      });

      if (filtered.length === 0) {
        container.innerHTML = `<div style="text-align:center; padding:2rem; color:var(--text-muted); font-size:0.85rem;">No se encontraron standards.</div>`;
        return;
      }

      container.innerHTML = filtered.map(s => {
        const isDue = s.level === "assimilated" && s.nextReview && s.nextReview <= today;
        const hasNotes = s.notes && s.notes.trim().length > 0;

        return `
          <div class="standard-card" onclick="openEditModal('${s.id}')">
            <div class="card-info">
              <div class="card-title">
                ${escapeHTML(s.title)}
                ${hasNotes ? `<span title="Tiene notas de estudio" style="font-size:0.75rem; opacity:0.85;">📝</span>` : ''}
              </div>
              <div class="card-meta mono">
                ${s.key ? `<span style="color:var(--accent);">${escapeHTML(s.key)}</span> •` : ''}
                ${s.form ? `<span>${escapeHTML(s.form)}</span>` : ''}
                ${s.level === 'assimilated' ? `
                  <span style="color:${isDue ? 'var(--red)' : 'var(--text-muted)'}; margin-left:0.3rem;">
                    ${isDue ? '⚠️ Repaso hoy' : `Repaso: ${s.nextReview || 'Programado'}`}
                  </span>

              </div>
              ${hasNotes ? `<div class="card-notes-preview">${escapeHTML(s.notes)}</div>` : ''}

                <button class="btn" style="padding:0.25rem 0.5rem; font-size:0.7rem; color:var(--green); border-color:rgba(74,222,128,0.3);" onclick="srsReview('${s.id}', 'solid', event)">✓ Sólido</button>
                <button class="btn" style="padding:0.25rem 0.5rem; font-size:0.7rem; color:var(--red); border-color:rgba(248,113,113,0.3);" onclick="srsReview('${s.id}', 'rusty', event)">✕ Oxidado</button>

    function render() {
      updateCounts();
      renderList();

    function saveStandard() {
      const id = document.getElementById("edit-id").value;
      const title = document.getElementById("edit-name").value.trim();
      const key = document.getElementById("edit-key").value.trim();
      const form = document.getElementById("edit-form").value.trim();
      const level = document.getElementById("edit-level").value;
      const notes = document.getElementById("edit-notes").value.trim();

      if (!title) return;

      if (id) {
        const item = standards.find(s => s.id === id);
        if (item) {
          item.title = title;
          item.key = key;
          item.form = form;
          item.level = level;
          item.notes = notes;
        }
      } else {
        standards.unshift({
          id: "std_" + Date.now(),
          title, key, form, level, notes,
          srsInterval: 15,
          nextReview: null
        });
      }
      save();
      closeModal("modal-overlay");
      render();
    }

        save();
        closeModal("modal-overlay");
        render();

    function renderWorkshop() {
      const container = document.getElementById("workshop-container");
      if (!container) return;

      const techCount = workshop.filter(w => w.type === "technique").length;
      const langCount = workshop.filter(w => w.type === "language").length;
      document.getElementById("wk-count-all").textContent = workshop.length;
      document.getElementById("wk-count-tech").textContent = techCount;
      document.getElementById("wk-count-lang").textContent = langCount;

      const search = (document.getElementById("wk-search-input").value || "").toLowerCase().trim();

      const filtered = workshop.filter(w => {
        if (wkFilter !== "all" && w.type !== wkFilter) return false;
        if (!search) return true;
        const inTitle = w.title.toLowerCase().includes(search);
        const inNotes = (w.notes || "").toLowerCase().includes(search);
        const inTags = (w.tags || []).some(t => t.toLowerCase().includes(search));
        return inTitle || inNotes || inTags;
      });

      if (filtered.length === 0) {
        container.innerHTML = `<div style="grid-column: 1 / -1; text-align:center; padding:2.5rem; color:var(--text-muted); font-size:0.85rem;">No hay fichas guardadas en esta categoría. Pulsa "+ Ficha Técnica / Frase" para añadir una.</div>`;
        return;
      }

      container.innerHTML = filtered.map(w => {
        const isTech = w.type === "technique";
        const tagsHtml = (w.tags || []).map(t => `<span class="wk-tag">${escapeHTML(t)}</span>`).join("");

        return `
          <div class="wk-card">
            <div style="display:flex; flex-direction:column; gap:0.5rem;">
              <div class="wk-header">
                <span class="wk-badge ${w.type}">${isTech ? '⚙️ Técnica' : '🎷 Lenguaje'}</span>
                <button class="btn" style="padding:0.2rem 0.5rem; font-size:0.7rem;" onclick="openEditWorkshopModal('${w.id}')">Editar</button>
              </div>
              <div style="font-weight:700; font-size:0.95rem; color:#fff;">${escapeHTML(w.title)}</div>
              ${tagsHtml ? `<div class="wk-tags">${tagsHtml}</div>` : ''}
              ${w.notes ? `<div class="wk-body">${escapeHTML(w.notes)}</div>` : ''}
            </div>
            ${w.imageUrl ? `
              <div class="wk-img-wrap" onclick="openLightbox('${w.imageUrl}')">
                <img src="${w.imageUrl}" alt="${escapeHTML(w.title)}" loading="lazy">
              </div>
            ` : ''}
          </div>
        `;
      }).join("");
    }

    function openLightbox(url) {
      document.getElementById("lightbox-img").src = url;
      document.getElementById("lightbox-overlay").style.display = "flex";
    }

    function openNewWorkshopModal() {
      document.getElementById("wk-modal-title").textContent = "Nueva Ficha de Estudio";
      document.getElementById("wk-edit-id").value = "";
      document.getElementById("wk-existing-url").value = "";
      document.getElementById("wk-edit-type").value = "technique";
      document.getElementById("wk-edit-tags").value = "";
      document.getElementById("wk-edit-title").value = "";
      document.getElementById("wk-edit-notes").value = "";
      pendingBase64Image = null;
      document.getElementById("wk-preview-container").innerHTML = "";
      document.getElementById("btn-clear-img").style.display = "none";
      document.getElementById("btn-wk-delete").style.display = "none";
      document.getElementById("wk-modal-overlay").style.display = "flex";
    }

    function openEditWorkshopModal(id) {
      const w = workshop.find(item => item.id === id);
      if (!w) return;
      document.getElementById("wk-modal-title").textContent = "Editar Ficha";
      document.getElementById("wk-edit-id").value = w.id;
      document.getElementById("wk-existing-url").value = w.imageUrl || "";
      document.getElementById("wk-edit-type").value = w.type || "technique";
      document.getElementById("wk-edit-tags").value = (w.tags || []).join(", ");
      document.getElementById("wk-edit-title").value = w.title;
      document.getElementById("wk-edit-notes").value = w.notes || "";
      pendingBase64Image = null;

      if (w.imageUrl) {
        document.getElementById("wk-preview-container").innerHTML = `<img src="${w.imageUrl}" class="paste-preview">`;
        document.getElementById("btn-clear-img").style.display = "inline-flex";
      } else {
        document.getElementById("wk-preview-container").innerHTML = "";
        document.getElementById("btn-clear-img").style.display = "none";
      }

      document.getElementById("btn-wk-delete").style.display = "inline-flex";
      document.getElementById("wk-modal-overlay").style.display = "flex";
    }

    function clearWorkshopImage(e) {
      if (e) e.stopPropagation();
      pendingBase64Image = null;
      document.getElementById("wk-existing-url").value = "";
      document.getElementById("wk-preview-container").innerHTML = "";
      document.getElementById("btn-clear-img").style.display = "none";
      document.getElementById("wk-file-input").value = "";
    }

    // Procesar imagen pegada (Cmd+V) o seleccionada
    document.addEventListener("paste", function(e) {
      const modalVisible = document.getElementById("wk-modal-overlay").style.display === "flex";
      if (!modalVisible) return;

      const items = (e.clipboardData || e.originalEvent.clipboardData).items;
      for (let i = 0; i < items.length; i++) {
        if (items[i].type.indexOf("image") !== -1) {
          const blob = items[i].getAsFile();
          compressImageFile(blob);
          break;
        }
      }
    });

    function handleImageFile(e) {
      const file = e.target.files[0];
      if (file) compressImageFile(file);
    }

    function compressImageFile(file) {
      const reader = new FileReader();
      reader.onload = function(event) {
        const img = new Image();
        img.onload = function() {
          const canvas = document.createElement("canvas");
          const MAX_WIDTH = 1100;
          let width = img.width;
          let height = img.height;

          if (width > MAX_WIDTH) {
            height = Math.round((height * MAX_WIDTH) / width);
            width = MAX_WIDTH;
          }

          canvas.width = width;
          canvas.height = height;
          const ctx = canvas.getContext("2d");
          ctx.fillStyle = "#ffffff";
          ctx.fillRect(0, 0, width, height);
          ctx.drawImage(img, 0, 0, width, height);

          pendingBase64Image = canvas.toDataURL("image/jpeg", 0.85);
          document.getElementById("wk-preview-container").innerHTML = `<img src="${pendingBase64Image}" class="paste-preview">`;
          document.getElementById("btn-clear-img").style.display = "inline-flex";
        };
        img.src = event.target.result;
      };
      reader.readAsDataURL(file);
    }

    async function saveWorkshopItem() {
      const id = document.getElementById("wk-edit-id").value;
      const type = document.getElementById("wk-edit-type").value;
      const title = document.getElementById("wk-edit-title").value.trim();
      const notes = document.getElementById("wk-edit-notes").value.trim();
      const tagsRaw = document.getElementById("wk-edit-tags").value;
      const tags = tagsRaw.split(",").map(t => t.trim()).filter(t => t.length > 0);
      let imageUrl = document.getElementById("wk-existing-url").value;

      if (!title) {
        alert("Escribe un título o concepto para la ficha.");
        return;
      }

      const btn = document.getElementById("btn-wk-save");
      const originalText = btn.innerHTML;

      // Si hay una nueva captura pegada, subirla primero a su carpeta de Drive
      if (pendingBase64Image) {
        btn.innerHTML = "⏳ Subiendo imagen a Drive...";
        btn.disabled = true;

        try {
          const res = await fetch(SCRIPT_URL, {
            method: "POST",
            headers: { "Content-Type": "text/plain;charset=utf-8" },
            body: JSON.stringify({
              action: "upload_image",
              category: type,
              title: title,
              imageBase64: pendingBase64Image
            })
          });
          const result = await res.json();
          if (result && result.status === "success" && result.imageUrl) {
            imageUrl = result.imageUrl;
          } else {
            throw new Error(result.message || "Error al guardar imagen en Drive");
          }
        } catch (err) {
          alert("No se pudo subir la imagen a Drive: " + err.message);
          btn.innerHTML = originalText;
          btn.disabled = false;
          return;
        }
      }

      if (id) {
        const item = workshop.find(w => w.id === id);
        if (item) {
          item.type = type;
          item.title = title;
          item.tags = tags;
          item.notes = notes;
          item.imageUrl = imageUrl;
        }
      } else {
        workshop.unshift({
          id: "wk_" + Date.now(),
          type,
          title,
          tags,
          notes,
          imageUrl
        });
      }

      save();
      btn.innerHTML = originalText;
      btn.disabled = false;
      closeModal("wk-modal-overlay");
      renderWorkshop();

      // Sincronizar automáticamente el índice JSON en Drive tras guardar la ficha
      saveToDrive();
    }

    function deleteCurrentWorkshop() {
      const id = document.getElementById("wk-edit-id").value;
      if (!id) return;
      if (confirm("¿Eliminar esta ficha de Técnica / Lenguaje?")) {
        workshop = workshop.filter(w => w.id !== id);
        save();
        closeModal("wk-modal-overlay");
        renderWorkshop();
      }
    }

    document.addEventListener("DOMContentLoaded", init);
  </script>
</body>
</html>
