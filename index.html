<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="REPERTORIO">
  <meta name="theme-color" content="#090a0c">
  <title>REPERTORIO</title>
  <link id="pwa-manifest" rel="manifest">
  <link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 180 180'%3E%3Crect width='180' height='180' rx='36' fill='%23090a0c'/%3E%3Ctext x='50%25' y='54%25' dominant-baseline='middle' text-anchor='middle' font-family='monospace' font-weight='bold' font-size='72' fill='%2338bdf8'%3EREP%3C/text%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #090a0c;
      --card: #121417;
      --card-border: #23272f;
      --text-main: #f3f4f6;
      --text-muted: #9ca3af;
      --accent: #38bdf8;
      --accent-muted: rgba(56, 189, 248, 0.15);
      --green: #4ade80;
      --amber: #fbbf24;
      --purple: #c084fc;
      --red: #f87171;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background-color: var(--bg);
      color: var(--text-main);
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      -webkit-font-smoothing: antialiased;
    }
    .mono { font-family: 'JetBrains Mono', monospace; }

    header {
      border-bottom: 1px solid var(--card-border);
      background-color: rgba(9, 10, 12, 0.95);
      position: sticky;
      top: 0;
      z-index: 30;
      backdrop-filter: blur(8px);
      padding: 0.7rem 1rem;
    }
    .header-inner {
      max-width: 1100px;
      margin: 0 auto;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 0.65rem;
    }
    .brand-left {
      display: flex;
      align-items: center;
      gap: 0.85rem;
      flex-wrap: wrap;
    }
    .brand-title {
      font-size: 1.1rem;
      font-weight: 800;
      letter-spacing: 0.08em;
      display: flex;
      align-items: center;
      gap: 0.45rem;
    }
    .badge-count {
      font-size: 0.72rem;
      padding: 0.12rem 0.48rem;
      border-radius: 9999px;
      background: var(--card-border);
      color: var(--text-muted);
    }

    .nav-tabs {
      display: inline-flex;
      background: #14171d;
      border: 1px solid var(--card-border);
      border-radius: 6px;
      padding: 0.18rem;
      gap: 0.18rem;
    }
    .nav-tab {
      padding: 0.32rem 0.68rem;
      font-size: 0.76rem;
      font-weight: 600;
      border-radius: 4px;
      border: none;
      background: transparent;
      color: var(--text-muted);
      cursor: pointer;
      transition: all 0.15s ease;
    }
    .nav-tab.active {
      background: var(--accent-muted);
      color: var(--accent);
    }

    .btn-group { display: flex; gap: 0.4rem; align-items: center; flex-wrap: wrap; }
    .btn {
      display: inline-flex;
      align-items: center;
      gap: 0.35rem;
      padding: 0.38rem 0.65rem;
      border-radius: 6px;
      font-size: 0.74rem;
      font-weight: 600;
      cursor: pointer;
      border: 1px solid var(--card-border);
      background: var(--card);
      color: var(--text-main);
      transition: all 0.15s ease;
      touch-action: manipulation;
    }
    .btn:hover { background: #1c2027; border-color: #3b4252; }
    .btn-primary { background: var(--accent); color: #000; border-color: var(--accent); }
    .btn-primary:hover { opacity: 0.9; }
    .btn-drive { background: #1e293b; color: #38bdf8; border-color: rgba(56, 189, 248, 0.4); }
    .btn-drive:hover { background: #283548; }
    .btn-drive.dirty {
      border-color: var(--amber);
      color: var(--amber);
      box-shadow: 0 0 10px rgba(251, 191, 36, 0.2);
    }

    /* PANEL DE ESTUDIO (METRÓNOMO + DRONES) */
    .studio-bar {
      background: #0e1014;
      border-bottom: 1px solid var(--card-border);
      padding: 0.75rem 1rem;
      display: none;
    }
    .studio-inner {
      max-width: 1100px;
      margin: 0 auto;
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
      gap: 0.85rem;
    }
    .studio-box {
      background: var(--card);
      border: 1px solid var(--card-border);
      border-radius: 8px;
      padding: 0.75rem 0.9rem;
      display: flex;
      flex-direction: column;
      gap: 0.6rem;
    }
    .studio-box-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.75rem;
      font-weight: 700;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }
    .metro-controls {
      display: flex;
      align-items: center;
      gap: 0.45rem;
      flex-wrap: wrap;
    }
    .bpm-display {
      font-size: 1.25rem;
      font-weight: 700;
      color: var(--accent);
      min-width: 68px;
      text-align: center;
    }
    .beat-dots {
      display: flex;
      gap: 0.35rem;
      align-items: center;
    }
    .beat-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: #23272f;
      transition: background 0.05s;
    }
    .beat-dot.active { background: var(--accent); box-shadow: 0 0 8px var(--accent); }
    .beat-dot.gap { background: #374151; border: 1px solid var(--amber); }

    .drone-notes {
      display: grid;
      grid-template-columns: repeat(6, 1fr);
      gap: 0.3rem;
    }
    .note-btn {
      padding: 0.35rem 0.2rem;
      font-size: 0.75rem;
      font-weight: 700;
      border-radius: 4px;
      border: 1px solid var(--card-border);
      background: #181b20;
      color: var(--text-main);
      cursor: pointer;
      text-align: center;
      touch-action: manipulation;
    }
    .note-btn:hover { border-color: #3b4252; }
    .note-btn.active {
      background: var(--accent);
      color: #000;
      border-color: var(--accent);
    }

    main {
      flex: 1;
      max-width: 1100px;
      width: 100%;
      margin: 0 auto;
      padding: 1rem;
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }

    .toolbar { display: flex; flex-direction: column; gap: 0.75rem; }
    .search-row { display: flex; gap: 0.5rem; }
    .input-text {
      flex: 1;
      background: var(--card);
      border: 1px solid var(--card-border);
      color: var(--text-main);
      padding: 0.55rem 0.85rem;
      border-radius: 6px;
      font-size: 0.85rem;
      outline: none;
      font-family: inherit;
    }
    .input-text:focus { border-color: var(--accent); }
    textarea.input-text {
      resize: vertical;
      min-height: 85px;
      line-height: 1.45;
    }

    .filter-chips { display: flex; flex-wrap: wrap; gap: 0.4rem; }
    .chip {
      padding: 0.35rem 0.65rem;
      font-size: 0.72rem;
      font-weight: 600;
      border-radius: 6px;
      background: var(--card);
      color: var(--text-muted);
      border: 1px solid var(--card-border);
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      touch-action: manipulation;
    }
    .chip.active {
      background: var(--accent-muted);
      color: var(--accent);
      border-color: var(--accent);
    }

    .roulette-panel {
      background: var(--card);
      border: 1px solid var(--card-border);
      border-radius: 8px;
      padding: 0.9rem 1rem;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 0.75rem;
    }

    .standards-list { display: flex; flex-direction: column; gap: 0.5rem; }
    .standard-card {
      background: var(--card);
      border: 1px solid var(--card-border);
      border-radius: 6px;
      padding: 0.65rem 0.85rem;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 0.5rem;
      cursor: pointer;
    }
    .standard-card:hover { border-color: #3b4252; }
    .card-info {
      display: flex;
      flex-direction: column;
      gap: 0.25rem;
      flex: 1;
      min-width: 200px;
    }
    .card-title {
      font-size: 0.92rem;
      font-weight: 700;
      color: #fff;
      display: flex;
      align-items: center;
      gap: 0.4rem;
    }
    .card-meta {
      font-size: 0.72rem;
      color: var(--text-muted);
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 0.4rem;
    }
    .card-notes-preview {
      font-size: 0.76rem;
      color: #94a3b8;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 520px;
      margin-top: 0.1rem;
    }
    .card-actions { display: flex; align-items: center; gap: 0.35rem; }
    .level-btn {
      width: 28px;
      height: 28px;
      border-radius: 4px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 0.72rem;
      font-weight: 700;
      border: 1px solid var(--card-border);
      background: #181b20;
      color: var(--text-muted);
      cursor: pointer;
      touch-action: manipulation;
    }
    .level-btn:hover { background: #23272f; }
    .level-btn.active-0 { background: #374151; color: #fff; border-color: #4b5563; }
    .level-btn.active-1 { background: #1e3a8a; color: #93c5fd; border-color: #3b82f6; }
    .level-btn.active-2 { background: #581c87; color: #d8b4fe; border-color: #a855f7; }
    .level-btn.active-3 { background: #854d0e; color: #fde047; border-color: #eab308; }
    .level-btn.active-4 { background: #064e3b; color: #6ee7b7; border-color: #10b981; }

    /* Tarjetas de Técnica / Lenguaje */
    .workshop-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
      gap: 0.85rem;
    }
    .wk-card {
      background: var(--card);
      border: 1px solid var(--card-border);
      border-radius: 8px;
      padding: 0.9rem;
      display: flex;
      flex-direction: column;
      gap: 0.6rem;
      justify-content: space-between;
    }
    .wk-card:hover { border-color: #3b4252; }
    .wk-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 0.5rem;
    }
    .wk-badge {
      font-size: 0.65rem;
      font-weight: 700;
      text-transform: uppercase;
      padding: 0.15rem 0.45rem;
      border-radius: 4px;
      letter-spacing: 0.04em;
    }
    .wk-badge.technique { background: rgba(251, 191, 36, 0.15); color: var(--amber); border: 1px solid rgba(251, 191, 36, 0.3); }
    .wk-badge.language { background: rgba(192, 132, 252, 0.15); color: var(--purple); border: 1px solid rgba(192, 132, 252, 0.3); }
    .wk-tags { display: flex; flex-wrap: wrap; gap: 0.3rem; }
    .wk-tag {
      font-size: 0.68rem;
      background: #1a1e26;
      color: var(--accent);
      padding: 0.1rem 0.4rem;
      border-radius: 4px;
      font-family: 'JetBrains Mono', monospace;
    }
    .wk-body {
      font-size: 0.8rem;
      color: #cbd5e1;
      white-space: pre-line;
      line-height: 1.45;
    }
    .wk-img-wrap {
      background: #f8fafc;
      border-radius: 6px;
      padding: 0.35rem;
      cursor: zoom-in;
      overflow: hidden;
      border: 1px solid var(--card-border);
    }
    .wk-img-wrap img {
      width: 100%;
      height: auto;
      display: block;
      border-radius: 3px;
    }

    .paste-zone {
      border: 1px dashed #3b4252;
      background: #0f1115;
      border-radius: 6px;
      padding: 0.85rem;
      text-align: center;
      font-size: 0.78rem;
      color: var(--text-muted);
      cursor: pointer;
      transition: border-color 0.15s;
    }
    .paste-zone:hover { border-color: var(--accent); color: var(--text-main); }
    .paste-preview {
      max-height: 180px;
      max-width: 100%;
      border-radius: 4px;
      margin-top: 0.5rem;
      border: 1px solid var(--card-border);
    }

    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.8);
      backdrop-filter: blur(4px);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 50;
      padding: 1rem;
      overflow-y: auto;
    }
    .modal-card {
      background: #16191f;
      border: 1px solid var(--card-border);
      border-radius: 8px;
      max-width: 520px;
      width: 100%;
      padding: 1.25rem;
      display: flex;
      flex-direction: column;
      gap: 0.85rem;
      margin: auto;
    }

    footer {
      border-top: 1px solid var(--card-border);
      padding: 1rem;
      text-align: center;
      font-size: 0.75rem;
      color: var(--text-muted);
      display: flex;
      justify-content: center;
      gap: 1rem;
    }
    .vol-control {
      display: flex;
      align-items: center;
      gap: 0.45rem;
      font-size: 0.72rem;
      color: var(--text-muted);
      padding-top: 0.15rem;
    }
    .vol-control input[type="range"] {
      flex: 1;
      height: 4px;
      accent-color: var(--accent);
      cursor: pointer;
    }
  </style>
</head>
<body>

  <header>
    <div class="header-inner">
      <div class="brand-left">
        <div class="brand-title mono">
          REPERTORIO
          <span id="total-badge" class="badge-count">0</span>
          <span id="sync-indicator" style="font-size:0.68rem; color:var(--text-muted); font-weight:400; opacity:0.85;"></span>
        </div>
        <div class="nav-tabs">
          <button id="tab-repertoire" class="nav-tab active" onclick="switchTab('repertoire')">🎷 Standards</button>
          <button id="tab-workshop" class="nav-tab" onclick="switchTab('workshop')">📚 Técnica / Lenguaje</button>
        </div>
      </div>

      <div class="btn-group">
        <button id="btn-studio-toggle" class="btn" onclick="toggleStudioBar()">⏱️ Estudio (Metrónomo / Drone)</button>
        <button id="btn-save-drive" class="btn btn-drive" onclick="saveToDrive()">☁️ Guardar en Drive</button>
        <button id="btn-load-drive" class="btn btn-drive" onclick="loadFromDrive()">☁️ Cargar de Drive</button>
        <button class="btn" title="Cambiar PIN de Drive" onclick="configurePin(true)" style="padding:0.38rem 0.5rem;">🔑</button>
      </div>
    </div>
  </header>

  <!-- PANEL DE ESTUDIO: METRÓNOMO (2 y 4 + GAP) Y DRONES (Bb/C) -->
  <section id="studio-bar" class="studio-bar">
    <div class="studio-inner">
      <!-- METRÓNOMO -->
      <div class="studio-box">
        <div class="studio-box-header">
          <span>Metrónomo (Tap de Pie)</span>
          <div class="beat-dots">
            <span id="dot-0" class="beat-dot"></span>
            <span id="dot-1" class="beat-dot"></span>
            <span id="dot-2" class="beat-dot"></span>
            <span id="dot-3" class="beat-dot"></span>
          </div>
        </div>
        <div class="metro-controls">
          <button id="btn-metro-play" class="btn btn-primary" onclick="toggleMetronome()">▶ Iniciar</button>
          <button class="btn mono" onclick="changeBpm(-5)">-5</button>
          <span id="bpm-val" class="bpm-display mono">120</span>
          <button class="btn mono" onclick="changeBpm(5)">+5</button>
          <button class="btn" onclick="tapTempo()">Tap</button>
        </div>
        <div class="metro-controls">
          <select id="metro-feel" class="input-text" style="padding:0.3rem 0.5rem; font-size:0.74rem;" onchange="resetMetroCounter()">
            <option value="2and4">Solo 2 y 4 (Jazz Swing)</option>
            <option value="all">Negras (1 - 2 - 3 - 4)</option>
            <option value="one">Solo tiempo 1</option>
          </select>
          <select id="metro-gap" class="input-text" style="padding:0.3rem 0.5rem; font-size:0.74rem;" onchange="onGapModeChange()">
            <option value="0">Sin silencios (Continuo)</option>
            <option value="random">Gap Aleatorio (%)</option>
            <option value="3-1">Gap: 3 compases ON / 1 OFF</option>
            <option value="2-2">Gap: 2 compases ON / 2 OFF</option>
            <option value="4-4">Gap: 4 compases ON / 4 OFF</option>
          </select>
        </div>
        <div id="random-gap-box" style="display:none; align-items:center; gap:0.5rem; font-size:0.74rem; color:var(--text-muted); padding-top:0.2rem;">
          <span>Silenciar taps:</span>
          <input type="range" id="gap-prob-slider" min="10" max="90" step="5" value="35" style="flex:1; accent-color:var(--accent);" oninput="document.getElementById('gap-prob-val').textContent = this.value + '%'">
          <span id="gap-prob-val" class="mono" style="color:var(--accent); font-weight:700; min-width:34px;">35%</span>
        </div>
        <div class="vol-control">
          <span>🔊</span>
          <input type="range" id="metro-vol-slider" min="0" max="1" step="0.05" value="0.75" oninput="updateMetroVolume(this.value)">
          <span id="metro-vol-val" class="mono" style="min-width:34px; text-align:right;">75%</span>
        </div>
      </div>

      <!-- DRONES / BORDONES -->
      <div class="studio-box">
        <div class="studio-box-header">
          <span>Drone / Bordón Armónico</span>
          <div style="display:flex; gap:0.3rem; align-items:center;">
            <select id="drone-transp" class="input-text mono" style="padding:0.15rem 0.35rem; font-size:0.7rem;" onchange="updateDroneSound()">
              <option value="-2">Saxo Bb (Ten/Sop)</option>
              <option value="0">Concert (C)</option>
            </select>
            <select id="drone-interval" class="input-text" style="padding:0.15rem 0.35rem; font-size:0.7rem;" onchange="updateDroneSound()">
              <option value="fifth">Tónica + 5ª</option>
              <option value="root">Solo Tónica</option>
              <option value="maj3">Tónica + 3ªM</option>
              <option value="min3">Tónica + 3ªm</option>
            </select>
          </div>
        </div>
        <div class="drone-notes mono" id="drone-grid"></div>
        <div class="vol-control">
          <span>🔊</span>
          <input type="range" id="drone-vol-slider" min="0" max="1" step="0.05" value="0.6" oninput="updateDroneVolume(this.value)">
          <span id="drone-vol-val" class="mono" style="min-width:34px; text-align:right;">60%</span>
        </div>
      </div>
    </div>
  </section>

  <!-- VISTA 1: REPERTORIO DE STANDARDS -->
  <main id="view-repertoire">
    <section class="toolbar">
      <div class="search-row">
        <input type="text" id="search-input" class="input-text" placeholder="Buscar standard, tonalidad o palabra clave en notas..." oninput="filterStandards()">
        <button class="btn btn-primary" onclick="openNewModal()">+ Standard</button>
      </div>

      <div class="filter-chips">
        <button class="chip active" onclick="setFilter('all', this)">Todos <span id="count-all" class="mono">0</span></button>
        <button class="chip" onclick="setFilter('pending', this)">F0: Pendientes <span id="count-0" class="mono">0</span></button>
        <button class="chip" onclick="setFilter('melody', this)">F1: Melodía <span id="count-1" class="mono">0</span></button>
        <button class="chip" onclick="setFilter('harmony', this)">F2: Armonía <span id="count-2" class="mono">0</span></button>
        <button class="chip" onclick="setFilter('maturation', this)">F3: Maduración <span id="count-3" class="mono">0</span></button>
        <button class="chip" onclick="setFilter('assimilated', this)">✓ Asimilados <span id="count-4" class="mono">0</span></button>
        <button class="chip" onclick="setFilter('srs-due', this)">⚠️ Repasos SRS <span id="count-due" class="mono">0</span></button>
      </div>
    </section>

    <section class="roulette-panel">
      <div>
        <div style="font-weight:700; font-size:0.85rem;">Práctica Aleatoria</div>
        <div style="font-size:0.72rem; color:var(--text-muted);">Sugerencia de estudio o jam en frío</div>
      </div>
      <div class="btn-group">
        <button class="btn" onclick="spinRoulette('study')">🎲 Fases 1-3</button>
        <button class="btn btn-primary" onclick="spinRoulette('cold')">⚡ En Frío (Asimilados)</button>
      </div>
    </section>

    <section id="roulette-box" style="display:none; background:#181b20; border:1px solid #38bdf8; border-radius:6px; padding:0.85rem;"></section>

    <section id="standards-container" class="standards-list"></section>
  </main>

  <!-- VISTA 2: TÉCNICA Y LENGUAJE -->
  <main id="view-workshop" style="display:none;">
    <section class="toolbar">
      <div class="search-row">
        <input type="text" id="wk-search-input" class="input-text" placeholder="Buscar ejercicio, acorde, etiqueta (ej. Terceras, II-V-I, 7alt)..." oninput="renderWorkshop()">

e","Like Sonny","Limehouse Blues","Little Sunflower","Long Ago and Far Away","Love for Sale","Lover","Lover Man","Lullaby of Birdland","Maiden Voyage","Manha de Carnaval","Meditation","Minority","Misterioso","Moment's Notice","Monk's Dream","Moose the Mooch","The More I See You","Move","Mr. P.C.","My Favorite Things","My Funny Valentine","My Ideal","My Little Suede Shoes","My One and Only Love","My Romance","My Shining Hour","Naima","Nica's Dream","Night and Day","Night Has a Thousand Eyes","A Night in Tunisia","Nothing Personal","Now's the Time","Old Devil Moon","Old Folks","Oleo","On a Slow Boat to China","On Green Dolphin Street","On the Sunny Side of the Street","One Note Samba","Ornithology","Out of Nowhere","Pannonica","Peace","Pensativa","Pent Up House","Perdido","Polka Dots and Moonbeams","Prelude to a Kiss","Recorda-Me","Reflections","Relaxin' at Camarillo","Rhythm-a-Ning","Room 608","Round Midnight","Ruby, My Dear","San-Du","Satin Doll","Scrapple from the Apple","Secret Love","Serpent's Tooth","Seven Come Eleven","Seven Steps to Heaven","Sidewinder","Skylark","So What","Softly, As in a Morning Sunrise","Solar","Some Day My Prince Will Come","Some Other Blues","Song for My Father","The Song Is You","Sonnymoon for Two","Soul Eyes","Speak Low","Speak No Evil","Spring Can Really Hang You Up the Most","St. Thomas","Stablemates","Star Eyes","Stella by Starlight","Stolen Moments","Straight, No Chaser","Sugar","Summertime","Take the 'A' Train","Tangerine","Tenderly","Tenor Madness","That's All","There Is No Greater Love","There Will Never Be Another You","This I Dig of You","The Touch of Your Lips","Triste","Tune Up","Turn Out the Stars","26-2","Up Jumped Spring","Upper Manhattan Medical Group","Voyage","Walking Shoes","Watermelon Man","Wave","Wee","Well You Needn't","When I Fall in Love","Whisper Not","Will You Still Be Mine","Woody 'n' You","Yardbird Suite","Yes or No","Yesterdays","You Stepped Out of a Dream","You'd Be So Nice to Come Home To"
    ];

    let standards = [];
    let workshop = [];
    let currentFilter = "all";
    let wkFilter = "all";
    let pendingBase64Image = null;
    let hasUnsavedChanges = false;

    // --- MANIFEST PWA DINÁMICO ---
    (function setupPWA() {
      const manifest = {
        name: "REPERTORIO Jazz & Técnica",
        short_name: "REPERTORIO",
        start_url: window.location.href,
        display: "standalone",
        background_color: "#090a0c",
        theme_color: "#090a0c",
        icons: [{
          src: "data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 512 512'%3E%3Crect width='512' height='512' rx='96' fill='%23090a0c'/%3E%3Ctext x='50%25' y='54%25' dominant-baseline='middle' text-anchor='middle' font-family='monospace' font-weight='bold' font-size='190' fill='%2338bdf8'%3EREP%3C/text%3E%3C/svg%3E",
          sizes: "512x512",
          type: "image/svg+xml"
        }]
      };
      const blob = new Blob([JSON.stringify(manifest)], { type: "application/json" });
      document.getElementById("pwa-manifest").setAttribute("href", URL.createObjectURL(blob));
    })();

    function escapeHTML(str) {
      if (!str) return "";
      return str
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
    }

    function markDirty(isDirty) {
      hasUnsavedChanges = isDirty;
      const btn = document.getElementById("btn-save-drive");
      if (!btn) return;
      if (isDirty) {
        btn.classList.add("dirty");
        btn.innerHTML = "● Guardar en Drive";
      } else {
        btn.classList.remove("dirty");
        btn.innerHTML = "☁️ Guardar en Drive";
      }
    }

    window.addEventListener("beforeunload", function (e) {
      if (hasUnsavedChanges) {
        e.preventDefault();
        e.returnValue = "";
      }
    });

    function getDrivePin() {
      let pin = localStorage.getItem(PIN_STORAGE_KEY);
      if (!pin) {
        pin = configurePin(false);
      }
      return pin;
    }

    function configurePin(forcePrompt) {
      const current = localStorage.getItem(PIN_STORAGE_KEY) || "";
      const entered = prompt("Introduce tu PIN de seguridad de Google Drive:", forcePrompt ? current : "");
      if (entered && entered.trim().length > 0) {
        localStorage.setItem(PIN_STORAGE_KEY, entered.trim());
        return entered.trim();
      }
      return current;
    }

    function switchTab(tab) {
      document.getElementById("tab-repertoire").classList.toggle("active", tab === "repertoire");
      document.getElementById("tab-workshop").classList.toggle("active", tab === "workshop");
      document.getElementById("view-repertoire").style.display = (tab === "repertoire") ? "flex" : "none";
      document.getElementById("view-workshop").style.display = (tab === "workshop") ? "flex" : "none";
      if (tab === "workshop") renderWorkshop();
    }

    function updateSyncTimestamp(timestampStr) {
      const el = document.getElementById("sync-indicator");
      if (!el) return;
      const val = timestampStr || localStorage.getItem(SYNC_STORAGE_KEY);
      el.textContent = val ? `• Sync: ${val}` : "";
    }

    function setSyncSuccess() {
      const now = new Date();
      const day = String(now.getDate()).padStart(2, '0');
      const month = String(now.getMonth() + 1).padStart(2, '0');
      const hours = String(now.getHours()).padStart(2, '0');
      const mins = String(now.getMinutes()).padStart(2, '0');
      const formatted = `${day}/${month} ${hours}:${mins}`;
      localStorage.setItem(SYNC_STORAGE_KEY, formatted);
      updateSyncTimestamp(formatted);
      markDirty(false);
    }

    function sortAllLists() {
      standards.sort((a, b) => a.title.localeCompare(b.title, 'es', { sensitivity: 'base' }));
      workshop.sort((a, b) => a.title.localeCompare(b.title, 'es', { sensitivity: 'base' }));
    }

    function init() {
      try {
        const saved = localStorage.getItem(STORAGE_KEY);
        if (saved) {
          const parsed = JSON.parse(saved);
          if (Array.isArray(parsed) && parsed.length > 0) {
            standards = parsed.map((s, idx) => ({
              id: s.id || `std_${idx}`,
              title: s.title || "Sin título",
              key: s.key || "",
              form: s.form || "AABA",
              level: ["pending", "melody", "harmony", "maturation", "assimilated"].includes(s.level) ? s.level : "pending",
              srsInterval: Number(s.srsInterval) || 15,
              nextReview: s.nextReview || null,
              notes: s.notes || ""
            }));
          } else {
            loadDefaults();
          }
        } else {
          loadDefaults();
        }

        const savedWk = localStorage.getItem(WORKSHOP_STORAGE_KEY);
        if (savedWk) {
          const parsedWk = JSON.parse(savedWk);
          if (Array.isArray(parsedWk)) workshop = parsedWk;
        }
      } catch (err) {
        console.error("Error cargando localStorage:", err);
        loadDefaults();
      }
      sortAllLists();
      buildDroneButtons();
      updateSyncTimestamp();
      render();
    }

    function loadDefaults() {
      standards = INITIAL_CATALOG.map((title, i) => ({
        id: "std_" + (i + 1),
        title: title,
        key: "",
        form: "AABA",
        level: "pending",
        srsInterval: 15,
        nextReview: null,
        notes: ""
      }));
      sortAllLists();
      save(false);
    }

    function resetToDefaults() {
      if (confirm("¿Restablecer todo el repertorio al catálogo inicial?")) {
        loadDefaults();
        render();
      }
    }

    function save(triggerDirty = true) {
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(standards));
        localStorage.setItem(WORKSHOP_STORAGE_KEY, JSON.stringify(workshop));
        if (triggerDirty) markDirty(true);
      } catch (e) {
        console.error("Error guardando en localStorage:", e);
      }
    }

    // --- SINCRONIZACIÓN SEGURA CON GOOGLE DRIVE ---

    async function saveToDrive() {
      const pin = getDrivePin();
      if (!pin) return;

      const btn = document.getElementById("btn-save-drive");
      btn.innerHTML = "⏳ Guardando...";
      btn.disabled = true;

      try {
        await fetch(SCRIPT_URL, {
          method: "POST",
          mode: "no-cors",
          headers: { "Content-Type": "text/plain;charset=utf-8" },
          body: JSON.stringify({
            token: pin,
            action: "save_all",
            standards: standards,
            workshop: workshop
          })
        });

        setSyncSuccess();
        btn.innerHTML = "✓ Guardado";
        setTimeout(() => {
          btn.innerHTML = "☁️ Guardar en Drive";
          btn.disabled = false;
        }, 1800);
      } catch (err) {
        alert("Error al enviar a Drive: " + err.message);
        btn.disabled = false;
        markDirty(hasUnsavedChanges);
      }
    }

    async function loadFromDrive() {
      const pin = getDrivePin();
      if (!pin) return;

      const btn = document.getElementById("btn-load-drive");
      const originalText = btn.innerHTML;
      btn.innerHTML = "⏳ Conectando...";
      btn.disabled = true;

      try {
        const sep = SCRIPT_URL.includes("?") ? "&" : "?";
        const urlConPin = `${SCRIPT_URL}${sep}token=${encodeURIComponent(pin)}&t=${Date.now()}`;
        const response = await fetch(urlConPin, { method: "GET" });
        const rawText = await response.text();

        let payload;
        try {
          payload = JSON.parse(rawText);
        } catch (e) {
          throw new Error("Respuesta no válida del servidor.");
        }

        if (payload && payload.status === "unauthorized") {
          localStorage.removeItem(PIN_STORAGE_KEY);
          alert("PIN incorrecto. Pulsa de nuevo 'Cargar de Drive' para introducir el PIN correcto.");
          return;
        }

        if (payload && payload.status === "empty") {
          alert("No se encontró ningún archivo .json en tu carpeta de Drive.");
          return;
        }

        const rawData = payload.data || payload.standards || payload;
        let listaStandards = [];
        let listaWorkshop = [];
        let nombreArchivo = payload.fileName || "respaldo";

        if (Array.isArray(rawData)) {
          listaStandards = rawData;
        } else if (rawData && Array.isArray(rawData.standards)) {
          listaStandards = rawData.standards;
          listaWorkshop = Array.isArray(rawData.workshop) ? rawData.workshop : [];
        }

        if (listaStandards.length > 0) {
          if (confirm(`Se han localizado ${listaStandards.length} standards y ${listaWorkshop.length} fichas (${nombreArchivo}).\n¿Sincronizar y actualizar este dispositivo?`)) {
            standards = listaStandards.map((s, idx) => ({
              id: s.id || `std_${idx}`,
              title: s.title || "Sin título",
              key: s.key || "",
              form: s.form || "AABA",
              level: ["pending", "melody", "harmony", "maturation", "assimilated"].includes(s.level) ? s.level : "pending",
              srsInterval: Number(s.srsInterval) || 15,
              nextReview: s.nextReview || null,
              notes: s.notes || ""
            }));
            workshop = listaWorkshop;
            sortAllLists();
            save(false);
            render();
            renderWorkshop();
            setSyncSuccess();
            btn.innerHTML = "✓ Sincronizado";
          }
        } else {
          alert("El archivo de Drive no contiene datos válidos.");
        }

      } catch (err) {
        alert("Error al cargar desde Drive: " + err.message);
      } finally {
        setTimeout(() => {
          btn.innerHTML = originalText;
          btn.disabled = false;
        }, 2000);
      }
    }

    // --- MOTOR DE AUDIO WEB (METRÓNOMO ACÚSTICO + DRONES) ---

    let audioCtx = null;
    function getAudioCtx() {
      if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      }
      if (audioCtx.state === "suspended") {
        audioCtx.resume();
      }
      return audioCtx;
    }

    function toggleStudioBar() {
      const bar = document.getElementById("studio-bar");
      const isVisible = bar.style.display === "block";
      bar.style.display = isVisible ? "none" : "block";
      document.getElementById("btn-studio-toggle").classList.toggle("active", !isVisible);
    }

    // 1. Metrónomo con transitorio tipo woodblock/rimshot y modo Gap
    let metroRunning = false;
    let bpm = 120;
    let currentBeat = 0;
    let currentBar = 0;
    let nextNoteTime = 0;
    let metroTimerId = null;
    let tapTimes = [];

    function changeBpm(delta) {
      bpm = Math.min(340, Math.max(30, bpm + delta));
      document.getElementById("bpm-val").textContent = bpm;
    }

    function tapTempo() {
      const now = performance.now();
      tapTimes.push(now);
      if (tapTimes.length > 4) tapTimes.shift();
      if (tapTimes.length >= 2) {
        let sum = 0;
        for (let i = 1; i < tapTimes.length; i++) sum += (tapTimes[i] - tapTimes[i - 1]);
        const avg = sum / (tapTimes.length - 1);
        bpm = Math.min(340, Math.max(30, Math.round(60000 / avg)));
        document.getElementById("bpm-val").textContent = bpm;
      }
    }

    function resetMetroCounter() {
      currentBeat = 0;
      currentBar = 0;
    }

    function onGapModeChange() {
      resetMetroCounter();
      const gapMode = document.getElementById("metro-gap").value;
      const sliderBox = document.getElementById("random-gap-box");
      if (sliderBox) {
        sliderBox.style.display = (gapMode === "random") ? "flex" : "none";
      }
    }

  let metroVolume = 0.75;
    function updateMetroVolume(val) {
      metroVolume = Number(val);
      document.getElementById("metro-vol-val").textContent = Math.round(metroVolume * 100) + "%";
    }

    // Sonido orgánico de tap de pie sobre madera con control de volumen
    function playClickSound(time, isAccent) {
      if (metroVolume <= 0) return;
      const ctx = getAudioCtx();

      // 1. Cuerpo grave del impacto del pie (145 Hz -> 45 Hz)
      const osc = ctx.createOscillator();
      const oscGain = ctx.createGain();
      osc.type = "sine";
      osc.frequency.setValueAtTime(isAccent ? 165 : 140, time);
      osc.frequency.exponentialRampToValueAtTime(45, time + 0.055);

      const peakOsc = (isAccent ? 0.95 : 0.75) * metroVolume;
      oscGain.gain.setValueAtTime(0.001, time);
      oscGain.gain.linearRampToValueAtTime(Math.max(0.002, peakOsc), time + 0.004);
      oscGain.gain.exponentialRampToValueAtTime(0.001, time + 0.065);

      osc.connect(oscGain);
      oscGain.connect(ctx.destination);
      osc.start(time);
      osc.stop(time + 0.07);

      // 2. Textura corta de suela/madera filtrada a 360 Hz
      const bufferSize = Math.floor(ctx.sampleRate * 0.035);
      const noiseBuffer = ctx.createBuffer(1, bufferSize, ctx.sampleRate);
      const data = noiseBuffer.getChannelData(0);
      for (let i = 0; i < bufferSize; i++) {
        data[i] = (Math.random() * 2 - 1) * Math.exp(-i / (ctx.sampleRate * 0.01));
      }

      const noise = ctx.createBufferSource();
      noise.buffer = noiseBuffer;

      const filter = ctx.createBiquadFilter();
      filter.type = "bandpass";
      filter.frequency.value = isAccent ? 460 : 360;
      filter.Q.value = 1.8;

      const peakNoise = (isAccent ? 0.5 : 0.36) * metroVolume;
      const noiseGain = ctx.createGain();
      noiseGain.gain.setValueAtTime(Math.max(0.002, peakNoise), time);
      noiseGain.gain.exponentialRampToValueAtTime(0.001, time + 0.032);

      noise.connect(filter);
      filter.connect(noiseGain);
      noiseGain.connect(ctx.destination);
      noise.start(time);
    }
    function scheduleMetronome() {
      const ctx = getAudioCtx();
      const lookahead = 0.1;
      const feel = document.getElementById("metro-feel").value;
      const gapMode = document.getElementById("metro-gap").value;
      const gapProb = Number(document.getElementById("gap-prob-slider")?.value || 35);

      while (nextNoteTime < ctx.currentTime + lookahead) {
        const beatInBar = currentBeat % 4;
        const barIndex = Math.floor(currentBeat / 4);

        // Determinar si el pulso corresponde al patrón rítmico elegido
        let inPattern = false;
        if (feel === "2and4") inPattern = (beatInBar === 1 || beatInBar === 3);
        else if (feel === "all") inPattern = true;
        else if (feel === "one") inPattern = (beatInBar === 0);

        // Evaluar si toca silencio (Gap por compases o Gap aleatorio por pulso)
        let isGap = false;
        if (gapMode === "3-1") {
          isGap = (barIndex % 4) === 3;
        } else if (gapMode === "2-2") {
          isGap = (barIndex % 4) >= 2;
        } else if (gapMode === "4-4") {
          isGap = (barIndex % 8) >= 4;
        } else if (gapMode === "random" && inPattern) {
          isGap = (Math.random() * 100) < gapProb;
        }

        const shouldSound = inPattern && !isGap;

        if (shouldSound) {
          playClickSound(nextNoteTime, beatInBar === 0 && feel === "all");
        }

        // Actualizar LED visual sincronizado (ámbar si el pulso ha sido silenciado)
        const visualBeat = beatInBar;
        const visualGap = isGap && inPattern;
        const delayMs = Math.max(0, (nextNoteTime - ctx.currentTime) * 1000);
        setTimeout(() => {
          for (let i = 0; i < 4; i++) {
            const dot = document.getElementById(`dot-${i}`);
            if (dot) {
              dot.className = "beat-dot" + (i === visualBeat ? (visualGap ? " gap" : " active") : "");
            }
          }
        }, delayMs);

        nextNoteTime += 60.0 / bpm;
        currentBeat++;
      }
      if (metroRunning) {
        metroTimerId = setTimeout(scheduleMetronome, 25);
      }
    }

    function toggleMetronome() {
      const btn = document.getElementById("btn-metro-play");
      if (!metroRunning) {
        const ctx = getAudioCtx();
        metroRunning = true;
        resetMetroCounter();
        nextNoteTime = ctx.currentTime + 0.05;
        btn.innerHTML = "⏹ Parar";
        btn.style.background = "var(--red)";
        btn.style.borderColor = "var(--red)";
        scheduleMetronome();
      } else {
        metroRunning = false;
        clearTimeout(metroTimerId);
        btn.innerHTML = "▶ Iniciar";
        btn.style.background = "";
        btn.style.borderColor = "";
        for (let i = 0; i < 4; i++) {
          document.getElementById(`dot-${i}`).className = "beat-dot";
        }
      }
    }

    // 2. Generador de Drones cálidos (Triangular + Sub + LowPass 650Hz)
    const NOTE_NAMES = ["C", "Db", "D", "Eb", "E", "F", "Gb", "G", "Ab", "A", "Bb", "B"];
    let activeDroneNoteIndex = null;
    let droneNodes = null;
    let droneVolume = 0.6;
    function updateDroneVolume(val) {
      droneVolume = Number(val);
      document.getElementById("drone-vol-val").textContent = Math.round(droneVolume * 100) + "%";
      if (droneNodes && droneNodes.masterGain) {
        const ctx = getAudioCtx();
        droneNodes.masterGain.gain.setTargetAtTime(droneVolume * 0.4, ctx.currentTime, 0.05);
      }
    }

    function buildDroneButtons() {
      const grid = document.getElementById("drone-grid");
      if (!grid) return;
      grid.innerHTML = NOTE_NAMES.map((n, idx) =>
        `<button class="note-btn" id="drone-btn-${idx}" onclick="toggleDroneNote(${idx})">${n}</button>`
      ).join("");
    }

    function stopDrone() {
      if (droneNodes) {
        const ctx = getAudioCtx();
        const now = ctx.currentTime;
        droneNodes.masterGain.gain.setTargetAtTime(0.0001, now, 0.08);
        const oldNodes = droneNodes;
        setTimeout(() => {
          oldNodes.oscs.forEach(o => { try { o.stop(); } catch(e){} });
        }, 350);
        droneNodes = null;
      }
      document.querySelectorAll(".note-btn").forEach(b => b.classList.remove("active"));
    }

    function toggleDroneNote(noteIdx) {
      if (activeDroneNoteIndex === noteIdx) {
        activeDroneNoteIndex = null;
        stopDrone();
        return;
      }
      activeDroneNoteIndex = noteIdx;
      document.querySelectorAll(".note-btn").forEach(b => b.classList.remove("active"));
      document.getElementById(`drone-btn-${noteIdx}`).classList.add("active");
      updateDroneSound();
    }

    function updateDroneSound() {
      if (activeDroneNoteIndex === null) return;
      stopDrone();
      document.getElementById(`drone-btn-${activeDroneNoteIndex}`).classList.add("active");

      const ctx = getAudioCtx();
      const transp = Number(document.getElementById("drone-transp").value); // -2 para Bb, 0 para C
      const intervalMode = document.getElementById("drone-interval").value;

      // MIDI base en octava grave cálida (C3 = 48)
      const rootMidi = 48 + activeDroneNoteIndex + transp;
      const rootFreq = 440 * Math.pow(2, (rootMidi - 69) / 12);

      const filter = ctx.createBiquadFilter();
      filter.type = "lowpass";
      filter.frequency.value = 650;
      filter.Q.value = 1.2;

     const masterGain = ctx.createGain();
      masterGain.gain.setValueAtTime(0.001, ctx.currentTime);
      masterGain.gain.setTargetAtTime(Math.max(0.0001, droneVolume * 0.4), ctx.currentTime, 0.12);

      filter.connect(masterGain);
      masterGain.connect(ctx.destination);

      const oscs = [];
      function addVoice(freq, type, detuneCents, vol) {
        const osc = ctx.createOscillator();
        const vGain = ctx.createGain();
        osc.type = type;
        osc.frequency.value = freq;
        osc.detune.value = detuneCents;
        vGain.gain.value = vol;
        osc.connect(vGain);
        vGain.connect(filter);
        osc.start();
        oscs.push(osc);
      }

      // Cuerpo principal: par triangular ligeramente desafinado + sub senoidal
      addVoice(rootFreq, "triangle", -3, 0.45);
      addVoice(rootFreq, "triangle", 3, 0.45);
      addVoice(rootFreq / 2, "sine", 0, 0.5);

      if (intervalMode === "fifth") {
        addVoice(rootFreq * Math.pow(2, 7 / 12), "triangle", 0, 0.35);
      } else if (intervalMode === "maj3") {
        addVoice(rootFreq * Math.pow(2, 4 / 12), "triangle", 0, 0.3);
      } else if (intervalMode === "min3") {
        addVoice(rootFreq * Math.pow(2, 3 / 12), "triangle", 0, 0.3);
      }

      droneNodes = { oscs, masterGain };
    }

    function updateCounts() {
      const counts = { pending: 0, melody: 0, harmony: 0, maturation: 0, assimilated: 0, due: 0 };
      const today = new Date().toISOString().split('T')[0];

      standards.forEach(s => {
        if (counts[s.level] !== undefined) counts[s.level]++;
        if (s.level === 'assimilated' && s.nextReview && s.nextReview <= today) {
          counts.due++;
        }
      });

      document.getElementById("total-badge").textContent = standards.length;
      document.getElementById("count-all").textContent = standards.length;
      document.getElementById("count-0").textContent = counts.pending;
      document.getElementById("count-1").textContent = counts.melody;
      document.getElementById("count-2").textContent = counts.harmony;
      document.getElementById("count-3").textContent = counts.maturation;
      document.getElementById("count-4").textContent = counts.assimilated;
      document.getElementById("count-due").textContent = counts.due;
    }

    function setFilter(filter, el) {
      currentFilter = filter;
      document.querySelectorAll("#view-repertoire .chip").forEach(c => c.classList.remove("active"));
      if (el) el.classList.add("active");
      renderList();

    function setLevel(id, newLevel, e) {
      if (e) e.stopPropagation();
      const item = standards.find(s => s.id === id);
      if (!item) return;

      item.level = newLevel;
      if (newLevel === "assimilated" && !item.nextReview) {
        item.srsInterval = 15;
        const d = new Date();
        d.setDate(d.getDate() + 15);
        item.nextReview = d.toISOString().split('T')[0];
      }
      save(true);
      render();
    }

    function srsReview(id, status, e) {
      if (e) e.stopPropagation();
      const item = standards.find(s => s.id === id);
      if (!item) return;

      const d = new Date();
      if (status === "solid") {
        item.srsInterval = Math.round((item.srsInterval || 15) * 2);
        d.setDate(d.getDate() + item.srsInterval);
        item.nextReview = d.toISOString().split('T')[0];
      } else {
        item.level = "maturation";
        item.srsInterval = 7;
        d.setDate(d.getDate() + 7);
        item.nextReview = d.toISOString().split('T')[0];
      }
      save(true);
      render();
    }

    function renderList() {
      const container = document.getElementById("standards-container");
      if (!container) return;

      const search = (document.getElementById("search-input").value || "").toLowerCase().trim();
      const today = new Date().toISOString().split('T')[0];

      const filtered = standards.filter(s => {
        const matchesSearch =
          s.title.toLowerCase().includes(search) ||
          (s.key && s.key.toLowerCase().includes(search)) ||
          (s.notes && s.notes.toLowerCase().includes(search));
        if (!matchesSearch) return false;

        if (currentFilter === "all") return true;
        if (currentFilter === "srs-due") return s.level === "assimilated" && s.nextReview && s.nextReview <= today;
        return s.level === currentFilter;
      });

      if (filtered.length === 0) {
        container.innerHTML = `<div style="text-align:center; padding:2rem; color:var(--text-muted); font-size:0.85rem;">No se encontraron standards.</div>`;
        return;
      }

      container.innerHTML = filtered.map(s => {
        const isDue = s.level === "assimilated" && s.nextReview && s.nextReview <= today;
        const hasNotes = s.notes && s.notes.trim().length > 0;

        return `
          <div class="standard-card" onclick="openEditModal('${s.id}')">
            <div class="card-info">
              <div class="card-title">
                ${escapeHTML(s.title)}
                ${hasNotes ? `<span title="Tiene notas de estudio" style="font-size:0.75rem; opacity:0.85;">📝</span>` : ''}
              </div>
              <div class="card-meta mono">
                ${s.key ? `<span style="color:var(--accent);">${escapeHTML(s.key)}</span> •` : ''}
                ${s.form ? `<span>${escapeHTML(s.form)}</span>` : ''}
                ${s.level === 'assimilated' ? `
                  <span style="color:${isDue ? 'var(--red)' : 'var(--text-muted)'}; margin-left:0.3rem;">
                    ${isDue ? '⚠️ Repaso hoy' : `Repaso: ${s.nextReview || 'Programado'}`}
                  </span>
                ` : ''}
              </div>
              ${hasNotes ? `<div class="card-notes-preview">${escapeHTML(s.notes)}</div>` : ''}

              ${s.level === 'assimilated' ? `
                <button class="btn" style="padding:0.25rem 0.5rem; font-size:0.7rem; color:var(--green); border-color:rgba(74,222,128,0.3);" onclick="srsReview('${s.id}', 'solid', event)">✓ Sólido</button>
                <button class="btn" style="padding:0.25rem 0.5rem; font-size:0.7rem; color:var(--red); border-color:rgba(248,113,113,0.3);" onclick="srsReview('${s.id}', 'rusty', event)">✕ Oxidado</button>
              ` : ''}
              <button class="level-btn ${s.level === 'pending' ? 'active-0' : ''}" title="F0: Pendientes" onclick="setLevel('${s.id}', 'pending', event)">0</button>

              <button class="level-btn ${s.level === 'harmony' ? 'active-2' : ''}" title="F2: Armonía" onclick="setLevel('${s.id}', 'harmony', event)">2</button>
              <button class="level-btn ${s.level === 'maturation' ? 'active-3' : ''}" title="F3: Maduración" onclick="setLevel('${s.id}', 'maturation', event)">3</button>
              <button class="level-btn ${s.level === 'assimilated' ? 'active-4' : ''}" title="✓ Asimilado" onclick="setLevel('${s.id}', 'assimilated', event)">✓</button>
            </div>
          </div>
        `;
      }).join('');
    }

    function render() {

    function spinRoulette(mode) {
      let pool = [];
      const challenges = [
        "Side-slipping: desplazar frases medio tono arriba o abajo de la armonía y resolver dentro.",
        "Tétradas / estructuras superiores: improvisar usando pares de tríadas (triad pairs) sobre cada acorde.",
        "Pares de intervalos: construir líneas exclusivamente mediante saltos de cuarta justa y quinta justa.",
        "Líneas cromáticas continuas: conectar notas guía mediante escalas bebop o cromatismos sin saltos.",
        "Sustituciones Coltrane.",
        "Menor melódica.",
        "Intervalos de cuartas.",
        "Nota pivot: mantener una nota común (tónica o quinta del tema) como eje melódico durante toda una sección A.",
        "Pentatónicas.",
        "Articulación invertida: ligar los tiempos débiles hacia los fuertes y picar solo las notas sincopadas.",
        "Subtone y pianissimo: tocar la melodía y un chorus completo al mínimo volumen posible sin perder aire.",
        "Crescendo estructural: empezar el chorus en ppp y llevar la intensidad hasta fff en el clímax del puente.",
        "Notas fantasma (ghost notes): exagerar el contraste dinámico entre notas acentuadas y notas semi-apagadas.",
        "Multifónicos o armónicos: integrar sobretonos o bifurcaciones tímbricas como puntos de tensión en el solo.",
        "Frases extralargas.",
        "Concepto baterístico.",
        "Registro agudo.",
        "Registro grave.",
        "Cross-bar phrasing: empezar y terminar todas las frases en mitad de compás, nunca en el tiempo 1.",
        "Rubato interno: flotar sobre el pulso del metrónomo acelerando y frenando frases sin perder el compás.",
        "Subdivisión de tresillos, quintillos o septillos.",
        "Tempo lento (40-50 BPM): tocar la melodía y el solo subdividiendo mentalmente a semicorcheas.",
        "Medio tiempo (Half-time feel): improvisar con sensación de balada sobre un pulso rápido de swing.",
        "Desplazamiento de la melodía.",
        "Elegir puntos de caídas de frases.",
        "Cita temática: insertar obligatoriamente el motivo de otro standard conocido dentro de tu solo.",
        "Contrafact instantáneo: improvisar una melodía nueva completa sobre los cambios sin tocar el tema original.",
        "Enfoque Steve Grossman / Joe Henderson: frases angulares con saltos amplios y síncopas agresivas.",
        "Enfoque Mark Turner / Ben Wendel: líneas largas en registro agudo, intervalos abiertos y poca vibración.",
        "Walking bass.",
        "Intercambio de 4s imaginario: tocar 4 compases de solo y 4 compases de acompañamiento rítmico (comping).",
        "Improvisar una coda o turnaround extendido sin acompañamiento y resolver en calderón.",
        "Lenguaje: trabajar una pieza de lenguaje concreta aplicándola en diferentes contextos armónicos.",
        "Cromatismos a notas de los acordes.",
        "Melodic Cells."
      ];

      if (mode === "study") {
        pool = standards.filter(s => ["melody", "harmony", "maturation"].includes(s.level));
      } else {
        pool = standards.filter(s => s.level === "assimilated");
      }

      const box = document.getElementById("roulette-box");
      if (pool.length === 0) {
        box.style.display = "block";
        box.innerHTML = `<span style="font-size:0.85rem; color:var(--text-muted);">No hay standards en esta categoría para la ruleta.</span>`;
        return;
      }

      const pick = pool[Math.floor(Math.random() * pool.length)];
      const chal = challenges[Math.floor(Math.random() * challenges.length)];
      const hasNotes = pick.notes && pick.notes.trim().length > 0;

      box.style.display = "block";
      box.innerHTML = `
        <div style="font-size:0.75rem; color:var(--accent); font-weight:700; text-transform:uppercase;">${mode === 'study' ? 'Estudio Activo' : 'En Frío'}</div>
        <div style="font-size:1.15rem; font-weight:800; color:#fff; margin:0.25rem 0;">${escapeHTML(pick.title)} ${pick.key ? `<span class="mono" style="font-size:0.85rem; color:var(--accent);">[${escapeHTML(pick.key)}]</span>` : ''}</div>
        <div style="font-size:0.8rem; color:var(--text-muted);">${chal}</div>
        ${hasNotes ? `<div style="margin-top:0.5rem; padding-top:0.5rem; border-top:1px solid var(--card-border); font-size:0.78rem; color:#cbd5e1; white-space:pre-line;">📝 ${escapeHTML(pick.notes)}</div>` : ''}
      `;
    }

      document.getElementById("wk-modal-overlay").style.display = "flex";
    }

    function openEditWorkshopModal(id) {
      const w = workshop.find(item => item.id === id);
      if (!w) return;
      document.getElementById("wk-modal-title").textContent = "Editar Ficha";
      document.getElementById("wk-edit-id").value = w.id;
      document.getElementById("wk-existing-url").value = w.imageUrl || "";
      document.getElementById("wk-edit-type").value = w.type || "technique";
      document.getElementById("wk-edit-tags").value = (w.tags || []).join(", ");
      document.getElementById("wk-edit-title").value = w.title;
      document.getElementById("wk-edit-notes").value = w.notes || "";
      pendingBase64Image = null;

      if (w.imageUrl) {
        document.getElementById("wk-preview-container").innerHTML = `<img src="${w.imageUrl}" class="paste-preview">`;
        document.getElementById("btn-clear-img").style.display = "inline-flex";
      } else {
        document.getElementById("wk-preview-container").innerHTML = "";
        document.getElementById("btn-clear-img").style.display = "none";
      }

      document.getElementById("btn-wk-delete").style.display = "inline-flex";
      document.getElementById("wk-modal-overlay").style.display = "flex";
    }

    function clearWorkshopImage(e) {
      if (e) e.stopPropagation();
      pendingBase64Image = null;
      document.getElementById("wk-existing-url").value = "";
      document.getElementById("wk-preview-container").innerHTML = "";
      document.getElementById("btn-clear-img").style.display = "none";
      document.getElementById("wk-file-input").value = "";
    }

    document.addEventListener("paste", function(e) {
      const modalVisible = document.getElementById("wk-modal-overlay").style.display === "flex";
      if (!modalVisible) return;

      const items = (e.clipboardData || e.originalEvent.clipboardData).items;
      for (let i = 0; i < items.length; i++) {
        if (items[i].type.indexOf("image") !== -1) {
          const blob = items[i].getAsFile();
          compressImageFile(blob);
          break;
        }
      }
    });

    function handleImageFile(e) {
      const file = e.target.files[0];
      if (file) compressImageFile(file);
    }

    function compressImageFile(file) {
      const reader = new FileReader();
      reader.onload = function(event) {
        const img = new Image();
        img.onload = function() {
          const canvas = document.createElement("canvas");
          const MAX_WIDTH = 1100;
          let width = img.width;
          let height = img.height;

          if (width > MAX_WIDTH) {
            height = Math.round((height * MAX_WIDTH) / width);
            width = MAX_WIDTH;
          }

          canvas.width = width;
          canvas.height = height;
          const ctx = canvas.getContext("2d");
          ctx.fillStyle = "#ffffff";
          ctx.fillRect(0, 0, width, height);
          ctx.drawImage(img, 0, 0, width, height);

          pendingBase64Image = canvas.toDataURL("image/jpeg", 0.85);
          document.getElementById("wk-preview-container").innerHTML = `<img src="${pendingBase64Image}" class="paste-preview">`;
          document.getElementById("btn-clear-img").style.display = "inline-flex";
        };
        img.src = event.target.result;
      };
      reader.readAsDataURL(file);
    }

    async function saveWorkshopItem() {
      const id = document.getElementById("wk-edit-id").value;
      const type = document.getElementById("wk-edit-type").value;
      const title = document.getElementById("wk-edit-title").value.trim();
      const notes = document.getElementById("wk-edit-notes").value.trim();
      const tagsRaw = document.getElementById("wk-edit-tags").value;
      const tags = tagsRaw.split(",").map(t => t.trim()).filter(t => t.length > 0);
      let imageUrl = document.getElementById("wk-existing-url").value;

      if (!title) {
        alert("Escribe un título o concepto para la ficha.");
        return;
      }

      const btn = document.getElementById("btn-wk-save");
      const originalText = btn.innerHTML;

      if (pendingBase64Image) {
        const pin = getDrivePin();
        if (!pin) return;

        btn.innerHTML = "⏳ Subiendo imagen...";
        btn.disabled = true;

        try {
          const res = await fetch(SCRIPT_URL, {
            method: "POST",
            headers: { "Content-Type": "text/plain;charset=utf-8" },
            body: JSON.stringify({
              token: pin,
              action: "upload_image",
              category: type,
              title: title,
              imageBase64: pendingBase64Image
            })
          });
          const result = await res.json();
          if (result && result.status === "unauthorized") {
            localStorage.removeItem(PIN_STORAGE_KEY);
            throw new Error("PIN incorrecto. Inténtalo de nuevo.");
          }
          if (result && result.status === "success" && result.imageUrl) {
            imageUrl = result.imageUrl;
          } else {
            throw new Error(result.message || "Error al guardar imagen en Drive");
          }
        } catch (err) {
          alert("No se pudo subir la imagen a Drive: " + err.message);
          btn.innerHTML = originalText;
          btn.disabled = false;
          return;
        }
      }

      if (id) {
        const item = workshop.find(w => w.id === id);
        if (item) {
          item.type = type;
          item.title = title;
          item.tags = tags;
          item.notes = notes;
          item.imageUrl = imageUrl;
        }
      } else {
        workshop.push({
          id: "wk_" + Date.now(),
          type,
          title,
          tags,
          notes,
          imageUrl
        });
      }

      sortAllLists();
      save(true);
      btn.innerHTML = originalText;
      btn.disabled = false;
      closeModal("wk-modal-overlay");
      renderWorkshop();
      saveToDrive();
    }

    function deleteCurrentWorkshop() {
      const id = document.getElementById("wk-edit-id").value;
      if (!id) return;
      if (confirm("¿Eliminar esta ficha de Técnica / Lenguaje?")) {
        workshop = workshop.filter(w => w.id !== id);
        save(true);
        closeModal("wk-modal-overlay");
        renderWorkshop();
      }
    }

    document.addEventListener("DOMContentLoaded", init);
  </script>
</body>
</html>
