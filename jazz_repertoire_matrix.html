<!DOCTYPE html>
<html lang="es" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Jazz Standards — Pipeline & Spaced Repetition (SRS)</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['"Plus Jakarta Sans"', 'sans-serif'],
            mono: ['"JetBrains Mono"', 'monospace'],
          },
          colors: {
            canvas: '#090a0c',
            surface: {
              900: '#101216',
              850: '#16191f',
              800: '#1c2027',
              700: '#272d37',
              600: '#38414f',
              400: '#838f9e',
              300: '#b0b9c5',
              100: '#f0f3f6'
            },
            status: {
              f0: '#64748b', // Backlog / Nivel 0
              f1: '#f59e0b', // Melodía & Guías
              f2: '#0ea5e9', // Lenguaje & 2/4
              f3: '#a855f7', // Maduración / A capella
              srs: '#10b981' // Asimilado / SRS
            }
          }
        }
      }
    }
  </script>
  <style>
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    input, select, textarea { color-scheme: dark; }
    .tap-active:active { transform: scale(0.985); }
  </style>
</head>
<body class="bg-canvas text-surface-100 font-sans antialiased min-h-screen selection:bg-surface-700 selection:text-white pb-14">

  <!-- ENTORNO PRINCIPAL -->
  <main class="max-w-5xl mx-auto px-3 sm:px-6 pt-4 sm:pt-6">
    
    <!-- HEADER COMPACTO & ACCIONES DE ESTUDIO -->
    <header class="border-b border-surface-800 pb-3 mb-4">
      <div class="flex flex-wrap items-center justify-between gap-3 mb-3">
        <div class="flex items-center gap-2.5">
          <h1 class="text-base sm:text-lg font-bold tracking-tight text-white font-mono uppercase">REPERTORIO</h1>
          <span id="headerTotalBadge" class="text-[11px] font-mono px-2 py-0.5 rounded bg-surface-850 text-surface-300 border border-surface-700/60 font-semibold">0 total</span>
        </div>

        <!-- BOTONERA DE COMANDOS -->
        <div class="flex items-center gap-1.5 flex-wrap">
          <!-- Backup / Gestión JSON directa en cabecera -->
          <button id="btnHeaderExport" title="Descargar copia JSON con fecha" class="tap-active flex items-center gap-1 px-2 py-1.5 rounded bg-surface-850 hover:bg-surface-800 border border-surface-700 text-surface-300 hover:text-white text-xs font-mono transition-colors">
            <svg class="w-3.5 h-3.5 text-surface-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a2 2 0 002 2h12a2 2 0 002-2v-1M12 4v12m0 0l-3.5-3.5M12 16l3.5-3.5"></path></svg>
            <span>Crear JSON</span>
          </button>
          
          <label title="Cargar archivo JSON" class="tap-active flex items-center gap-1 px-2 py-1.5 rounded bg-surface-850 hover:bg-surface-800 border border-surface-700 text-surface-300 hover:text-white text-xs font-mono cursor-pointer transition-colors">
            <svg class="w-3.5 h-3.5 text-surface-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a2 2 0 002 2h12a2 2 0 002-2v-1M16 8l-4-4m0 0L8 8m4-4v12"></path></svg>
            <span>Cargar JSON</span>
            <input type="file" id="headerImportInput" accept=".json" class="hidden">
          </label>

          <!-- Estudio Activo al azar -->
          <button id="btnStudyRoll" class="tap-active flex items-center gap-1.5 px-2.5 py-1.5 rounded bg-surface-850 hover:bg-surface-800 border border-amber-600/40 text-amber-300 text-xs font-mono font-medium transition-colors">
            <span>🎲</span>
            <span>Estudio</span>
          </button>
          
          <!-- En Frío (Asimilados) -->
          <button id="btnJamRoll" class="tap-active flex items-center gap-1.5 px-2.5 py-1.5 rounded bg-surface-850 hover:bg-surface-800 border border-emerald-600/40 text-emerald-300 text-xs font-mono font-medium transition-colors">
            <span>⚡</span>
            <span>En Frío</span>
          </button>

          <!-- Nuevo Standard -->
          <button id="btnOpenNew" class="tap-active flex items-center gap-1 px-2.5 py-1.5 rounded bg-surface-100 hover:bg-white text-canvas text-xs font-semibold tracking-wide transition-colors">
            <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M12 4.5v15m7.5-7.5h-15"></path></svg>
            <span>Añadir</span>
          </button>
        </div>
      </div>

      <!-- CHIPS DE KPI / FILTRADO RÁPIDO (UNA SOLA LÍNEA HORIZONTAL CON SCROLL) -->
      <div class="flex items-center gap-1.5 overflow-x-auto no-scrollbar pt-1 text-xs font-mono" id="filterPillsContainer">
        <!-- Renderizado dinámicamente con badges numéricos exactos -->
      </div>
    </header>

    <!-- BARRA DE FILTROS SECUNDARIOS & BÚSQUEDA -->
    <section class="flex flex-wrap sm:flex-nowrap gap-2 mb-3">
      <div class="relative flex-1 min-w-[200px]">
        <svg class="w-3.5 h-3.5 absolute left-3 top-1/2 -translate-y-1/2 text-surface-400 pointer-events-none" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path></svg>
        <input type="text" id="searchInput" placeholder="Filtrar por título, tonalidad (Bb, Fm...), compases, autor..." class="w-full bg-surface-900 border border-surface-800 rounded py-1.5 pl-8 pr-3 text-xs text-surface-100 placeholder-surface-400/70 focus:outline-none focus:border-surface-600 transition-colors">
      </div>
      
      <div class="flex items-center gap-1.5 shrink-0">
        <select id="sortSelect" class="bg-surface-900 border border-surface-800 rounded py-1.5 px-2 text-xs font-mono text-surface-300 focus:outline-none focus:border-surface-600">
          <option value="alpha">A-Z Alfabético</option>
          <option value="status">Por Fase Técnica</option>
          <option value="tempo">Por Tempo (BPM)</option>
          <option value="due">Prioridad Repaso SRS</option>
        </select>
        
        <button id="btnFilterDueToday" class="tap-active flex items-center gap-1.5 px-2.5 py-1.5 rounded bg-surface-900 hover:bg-surface-850 border border-surface-800 text-xs font-mono text-surface-300 transition-colors">
          <span class="w-2 h-2 rounded-full bg-emerald-400" id="dueIndicatorDot"></span>
          <span id="dueFilterLabel">Repasos (0)</span>
        </button>
      </div>
    </section>

    <!-- LISTADO COMPACTO DE STANDARDS -->
    <div id="standardsContainer" class="space-y-1">
      <!-- Se inyecta dinámicamente -->
    </div>

    <!-- ESTADO VACÍO -->
    <div id="emptyView" class="hidden py-12 text-center border border-dashed border-surface-800 rounded-lg">
      <p class="text-xs font-mono text-surface-400">No hay standards que coincidan con el filtro actual.</p>
    </div>

    <!-- PIE TÉCNICO Y GESTIÓN DE DATOS -->
    <footer class="mt-10 pt-4 border-t border-surface-850 flex flex-wrap items-center justify-between gap-3 text-[11px] font-mono text-surface-400">
      <div class="flex items-center gap-2.5 flex-wrap">
        <button id="btnExportData" class="hover:text-surface-200 underline">Exportar Backup JSON</button>
        <span>•</span>
        <label class="hover:text-surface-200 underline cursor-pointer">
          Restaurar JSON
          <input type="file" id="importFileInput" accept=".json" class="hidden">
        </label>
        <span>•</span>
        <button id="btnResetVault" class="hover:text-amber-400 underline">Reiniciar a lista completa (Fase 0)</button>
      </div>
      <div class="text-surface-400">
        Persistencia Local: <span id="storageSizeInfo" class="text-surface-300">Activa</span>
      </div>
    </footer>
  </main>

  <!-- MODAL: DETALLES / EDICIÓN COMPLETA -->
  <div id="detailModal" class="fixed inset-0 z-50 bg-black/80 backdrop-blur-xs flex items-end sm:items-center justify-center p-0 sm:p-4 hidden">
    <div class="bg-surface-900 border border-surface-700 w-full sm:max-w-lg rounded-t-xl sm:rounded-lg p-5 max-h-[92vh] overflow-y-auto no-scrollbar shadow-2xl">
      <div class="flex items-center justify-between border-b border-surface-800 pb-3 mb-3">
        <h3 id="modalHeadTitle" class="text-xs font-bold font-mono uppercase tracking-wider text-surface-200">Editar Standard</h3>
        <button id="btnCloseDetailModal" class="text-surface-400 hover:text-white p-1">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
        </button>
      </div>

      <form id="editStandardForm" class="space-y-3.5">
        <input type="hidden" id="editId">

        <div>
          <label class="block text-[10px] font-mono uppercase text-surface-400 mb-1">Título *</label>
          <input type="text" id="editTitle" required class="w-full bg-surface-850 border border-surface-700 rounded px-2.5 py-1.5 text-xs text-white focus:outline-none focus:border-surface-400">
        </div>

        <div class="grid grid-cols-2 gap-2.5">
          <div>
            <label class="block text-[10px] font-mono uppercase text-surface-400 mb-1">Tono Concert *</label>
            <input type="text" id="editKeyConcert" required placeholder="Bb, F, Eb, C minor..." class="w-full bg-surface-850 border border-surface-700 rounded px-2.5 py-1.5 text-xs font-mono text-white focus:outline-none focus:border-surface-400">
          </div>
          <div>
            <label class="block text-[10px] font-mono uppercase text-surface-400 mb-1">Tono Sax / Transp.</label>
            <input type="text" id="editKeyTransposed" placeholder="C, G, D minor..." class="w-full bg-surface-850 border border-surface-700 rounded px-2.5 py-1.5 text-xs font-mono text-white focus:outline-none focus:border-surface-400">
          </div>
        </div>

        <div class="grid grid-cols-2 gap-2.5">
          <div>
            <label class="block text-[10px] font-mono uppercase text-surface-400 mb-1">Estructura / Forma</label>
            <input type="text" id="editForm" placeholder="AABA (32c), Blues, ABAC..." class="w-full bg-surface-850 border border-surface-700 rounded px-2.5 py-1.5 text-xs font-mono text-white focus:outline-none focus:border-surface-400">
          </div>
          <div>
            <label class="block text-[10px] font-mono uppercase text-surface-400 mb-1">Tempo diana (BPM)</label>
            <input type="number" id="editTempo" min="40" max="360" placeholder="160" class="w-full bg-surface-850 border border-surface-700 rounded px-2.5 py-1.5 text-xs font-mono text-white focus:outline-none focus:border-surface-400">
          </div>
        </div>

        <div>
          <label class="block text-[10px] font-mono uppercase text-surface-400 mb-1">Nivel de Asimilación</label>
          <select id="editStatus" class="w-full bg-surface-850 border border-surface-700 rounded px-2.5 py-1.5 text-xs font-mono text-white focus:outline-none focus:border-surface-400">
            <option value="f0">Fase 0 · Pendientes</option>
            <option value="f1">Fase 1 · Melodía</option>
            <option value="f2">Fase 2 · Armonía</option>
            <option value="f3">Fase 3 · Maduración</option>
            <option value="srs">Asimilado · En rotación SRS</option>
          </select>
        </div>

        <div>
          <label class="block text-[10px] font-mono uppercase text-surface-400 mb-1">Notas técnicas / Grabación de referencia</label>
          <textarea id="editNotes" rows="2" placeholder="Referencia: Sonny Rollins 1957; cuidar voice leading en compases 13-16..." class="w-full bg-surface-850 border border-surface-700 rounded px-2.5 py-1.5 text-xs text-surface-200 focus:outline-none focus:border-surface-400"></textarea>
        </div>

        <div class="flex items-center justify-between pt-2 border-t border-surface-800">
          <button type="button" id="btnDeleteStd" class="text-xs font-mono text-red-400 hover:text-red-300 py-1 hidden">
            Eliminar
          </button>
          <div class="flex items-center gap-2 ml-auto">
            <button type="button" id="btnCancelDetail" class="px-3 py-1.5 rounded text-xs font-mono text-surface-400 hover:text-white">Cancelar</button>
            <button type="submit" class="px-3.5 py-1.5 rounded bg-surface-100 hover:bg-white text-canvas text-xs font-semibold">Guardar</button>
          </div>
        </div>
      </form>
    </div>
  </div>

  <!-- MODAL: RULETA ALEATORIA DE SESIÓN -->
  <div id="rouletteModal" class="fixed inset-0 z-50 bg-black/80 backdrop-blur-xs flex items-center justify-center p-3 sm:p-4 hidden">
    <div class="bg-surface-900 border border-surface-700 w-full max-w-md rounded-lg p-5 shadow-2xl">
      <div class="flex items-center justify-between border-b border-surface-800 pb-2.5 mb-3">
        <div class="flex items-center gap-2">
          <span id="rouletteIcon" class="text-sm">🎲</span>
          <h3 id="rouletteTitleHeading" class="text-xs font-bold font-mono uppercase tracking-wider text-surface-200">Sugerencia de Estudio</h3>
        </div>
        <button id="btnCloseRoulette" class="text-surface-400 hover:text-white p-1">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
        </button>
      </div>

      <div id="rouletteResultBox" class="p-4 rounded bg-surface-850 border border-surface-800 space-y-2">
        <div class="flex items-center justify-between">
          <span id="roulettePhaseBadge" class="text-[10px] font-mono px-1.5 py-0.5 rounded border"></span>
          <span id="rouletteKeyPill" class="text-xs font-mono font-bold text-white"></span>
        </div>
        <h4 id="rouletteStdName" class="text-lg font-bold text-white tracking-tight"></h4>
        <div class="flex items-center gap-2 text-xs font-mono text-surface-400">
          <span id="rouletteFormPill"></span>
          <span>•</span>
          <span id="rouletteTempoPill"></span>
        </div>
        
        <div class="mt-3 pt-2.5 border-t border-surface-700/60">
          <span class="block text-[10px] font-mono uppercase text-amber-400 mb-0.5">Enfoque de Estudio Recomendado</span>
          <p id="rouletteChallenge" class="text-xs font-mono text-surface-200 leading-relaxed"></p>
        </div>
      </div>

      <div id="rouletteEmptyMsg" class="hidden py-8 text-center text-xs font-mono text-surface-400">
        No se encontraron temas en este grupo.
      </div>

      <div class="mt-4 flex gap-2">
        <button id="btnSpinAgain" class="flex-1 py-1.5 rounded bg-surface-100 hover:bg-white text-canvas text-xs font-mono font-semibold transition-colors">
          Tirar de nuevo
        </button>
      </div>
    </div>
  </div>

  <script>
    /* =========================================================================
       CATÁLOGO COMPLETO DE STANDARDS (TODOS EN FASE 0 - BACKLOG INICIAL)
       ========================================================================= */

    // Desafíos pedagógicos para la ruleta
    const STUDY_CHALLENGES = [
      'Tocar melodía íntegra con metrónomo en pulsos 2 y 4 a tempo medio.',
      'Solo continuo usando exclusivamente arpegios de 4 notas (1-3-5-7 o 7-5-3-1).',
      'Tocar a capella (sin backing track) manteniendo la forma mentalmente.',
      'Transportar mentalmente 1 tono arriba en tiempo real.',
      'Tocar el tema como un Vals Jazz (3/4 feel) reinterpretando el ritmo armónico.',
      'Aumentar el tempo objetivo diana en +15%.',
      'Reducir a balada lenta (60 BPM) cuidando el timbre y ornamentación.',
      'Hacer un chorus completo tocando exclusivamente notas guía (terceras y séptimas).'
    ];

    /* =========================================================================
       ESTADO DE LA APLICACIÓN
       ========================================================================= */
    let standards = [];
    let currentFilter = 'all'; // 'all' | 'f0' | 'f1' | 'f2' | 'f3' | 'srs' | 'due'
    let searchQuery = '';
    let sortMode = 'alpha'; // 'alpha' | 'status' | 'tempo' | 'due'
    let expandedId = null;

    /* =========================================================================
       INICIALIZACIÓN Y PERSISTENCIA
       ========================================================================= */
    function loadData() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (raw) {
          standards = JSON.parse(raw);
        } else {
          // Inicializar catálogo completo con estado Fase 0
          standards = MASTER_SEED.map(item => ({
            id: item.id,
            title: item.title,
            keyConcert: item.key,
            keyTransposed: '',
            form: item.form,
            tempo: item.tempo,
            status: 'f0',
            notes: item.notes,
            srsInterval: 0,
            lastReviewed: null,
            nextReview: null
          }));
          saveData();
        }
      } catch (err) {
        console.error('Error cargando almacenamiento:', err);
        standards = [];
      }
    }

    function saveData() {
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(standards));
        const byteCount = new Blob([JSON.stringify(standards)]).size;
        document.getElementById('storageSizeInfo').textContent = `${Math.round(byteCount / 1024)} KB`;
      } catch (err) {
        console.error('Error guardando en localStorage:', err);
      }
    }

    function getTodayString() {
      return new Date().toISOString().split('T')[0];
    }

    function addDays(dateStr, days) {
      const d = dateStr ? new Date(dateStr) : new Date();
      d.setDate(d.getDate() + days);
      return d.toISOString().split('T')[0];
    }

    function isDue(std) {
      if (std.status !== 'srs' || !std.nextReview) return false;
      return std.nextReview <= getTodayString();
    }

    function countDueSRS() {
      return standards.filter(isDue).length;
    }

    /* =========================================================================
       RENDERIZADO
       ========================================================================= */
    function renderApp() {
      renderPills();
      renderList();
    }

    // 1. Chips de estadísticas y filtros superiores
    function renderPills() {
      const total = standards.length;
      document.getElementById('headerTotalBadge').textContent = `${total} standards`;

      const counts = { all: total, f0: 0, f1: 0, f2: 0, f3: 0, srs: 0 };
      standards.forEach(s => {
        if (counts[s.status] !== undefined) counts[s.status]++;
      });

      const dueCount = countDueSRS();
      const dueLabel = document.getElementById('dueFilterLabel');
      const dueDot = document.getElementById('dueIndicatorDot');
      dueLabel.textContent = `Repasos (${dueCount})`;
      dueDot.classList.toggle('hidden', dueCount === 0);

      const pillDefs = [
        { id: 'all', label: 'Todos', count: counts.all, dot: '#94a3b8' },
        { id: 'f0', label: 'F0 Pendientes', count: counts.f0, dot: STATUS_CONFIG.f0.dot },
        { id: 'f1', label: 'F1 Melodía', count: counts.f1, dot: STATUS_CONFIG.f1.dot },
        { id: 'f2', label: 'F2 Armonía', count: counts.f2, dot: STATUS_CONFIG.f2.dot },
        { id: 'f3', label: 'F3 Maduración', count: counts.f3, dot: STATUS_CONFIG.f3.dot },
        { id: 'srs', label: 'Asimilados', count: counts.srs, dot: STATUS_CONFIG.srs.dot }
      ];

      const container = document.getElementById('filterPillsContainer');
      container.innerHTML = pillDefs.map(p => {
        const isSel = currentFilter === p.id;
        const activeClass = isSel 
          ? 'bg-surface-700 text-white border-surface-400 font-semibold' 
          : 'bg-surface-900 hover:bg-surface-850 text-surface-400 border-surface-800';

        return `
          <button data-filter="${p.id}" class="tap-active pill-btn flex items-center gap-1.5 px-2.5 py-1 rounded border text-[11px] whitespace-nowrap transition-colors ${activeClass}">
            <span class="w-1.5 h-1.5 rounded-full" style="background-color: ${p.dot}"></span>
            <span>${p.label}</span>
            <span class="opacity-60 text-[10px]">(${p.count})</span>
          </button>
        `;
      }).join('');

      container.querySelectorAll('.pill-btn').forEach(btn => {
        btn.addEventListener('click', () => {
          currentFilter = btn.dataset.filter;
          renderApp();
        });
      });
    }

    // 2. Renderizado de lista de standards con selector de estado directo
    function renderList() {
      const container = document.getElementById('standardsContainer');
      const empty = document.getElementById('emptyView');
      const q = searchQuery.trim().toLowerCase();

      // Filtrar
      let filtered = standards.filter(std => {
        if (currentFilter === 'due') {
          if (!isDue(std)) return false;
        } else if (currentFilter !== 'all') {
          if (std.status !== currentFilter) return false;
        }

        if (q) {
          const mTitle = (std.title || '').toLowerCase().includes(q);
          const mKey = (std.keyConcert || '').toLowerCase().includes(q) || (std.keyTransposed || '').toLowerCase().includes(q);
          const mForm = (std.form || '').toLowerCase().includes(q);
          const mNotes = (std.notes || '').toLowerCase().includes(q);
          if (!mTitle && !mKey && !mForm && !mNotes) return false;
        }

        return true;
      });

      // Ordenar
      filtered.sort((a, b) => {
        if (sortMode === 'alpha') {
          return a.title.localeCompare(b.title);
        } else if (sortMode === 'status') {
          const rank = { f1: 1, f2: 2, f3: 3, srs: 4, f0: 5 };
          return (rank[a.status] || 9) - (rank[b.status] || 9);
        } else if (sortMode === 'tempo') {
          return (b.tempo || 0) - (a.tempo || 0);
        } else if (sortMode === 'due') {
          const dueA = isDue(a) ? 1 : 0;
          const dueB = isDue(b) ? 1 : 0;
          return dueB - dueA;
        }
        return 0;
      });

      if (filtered.length === 0) {
        container.innerHTML = '';
        empty.classList.remove('hidden');
        return;
      }

      empty.classList.add('hidden');

      container.innerHTML = filtered.map(std => {
        const isExp = expandedId === std.id;
        const cfg = STATUS_CONFIG[std.status] || STATUS_CONFIG.f0;
        const stdDue = isDue(std);

            <!-- Fila Principal Compacta -->
            <div class="px-2.5 py-2 flex items-center justify-between gap-2.5 cursor-pointer select-none" onclick="toggleRow('${std.id}')">

                    <span class="text-xs sm:text-sm font-semibold text-white tracking-tight truncate">${escapeHtml(std.title)}</span>
                    ${stdDue ? `<span class="shrink-0 text-[8px] font-mono font-bold px-1 py-0.2 rounded bg-emerald-950 border border-emerald-500/80 text-emerald-300">SRS HOY</span>` : ''}
                  </div>
                  <div class="flex items-center gap-2 text-[10px] font-mono text-surface-400 mt-0.2">
                    <span class="text-surface-200 font-medium">${escapeHtml(std.keyConcert || '—')}</span>
                    ${std.keyTransposed ? `<span class="opacity-70">(${escapeHtml(std.keyTransposed)})</span>` : ''}
                    <span>•</span>
                    <span class="truncate opacity-80">${escapeHtml(std.form || 'Std')}</span>
                  </div>
                </div>
              </div>

              <!-- Metadatos y Barra de Cambio Rápido de Estado -->
              <div class="flex items-center gap-2 shrink-0">
                <div class="hidden sm:block text-right font-mono">
                  <div class="text-[11px] text-surface-200 font-medium">${std.tempo ? `${std.tempo} <span class="text-[9px] text-surface-400">BPM</span>` : '—'}</div>
                </div>

                <!-- Botonera Rápida de Nivel (0, 1, 2, 3, Asim) -->
                <div class="flex items-center p-0.5 rounded bg-surface-950 border border-surface-800 text-[9px] font-mono" onclick="event.stopPropagation()">
                  <button onclick="changeStatus('${std.id}', 'f0')" title="Fase 0: Pendientes" class="px-1.5 py-0.5 rounded ${std.status === 'f0' ? 'bg-surface-700 text-white font-bold' : 'text-surface-400 hover:text-white'}">0</button>
                  <button onclick="changeStatus('${std.id}', 'f1')" title="Fase 1: Melodía" class="px-1.5 py-0.5 rounded ${std.status === 'f1' ? 'bg-amber-600 text-white font-bold' : 'text-surface-400 hover:text-amber-400'}">1</button>
                  <button onclick="changeStatus('${std.id}', 'f2')" title="Fase 2: Armonía" class="px-1.5 py-0.5 rounded ${std.status === 'f2' ? 'bg-sky-600 text-white font-bold' : 'text-surface-400 hover:text-sky-400'}">2</button>
                  <button onclick="changeStatus('${std.id}', 'f3')" title="Fase 3: Maduración" class="px-1.5 py-0.5 rounded ${std.status === 'f3' ? 'bg-purple-600 text-white font-bold' : 'text-surface-400 hover:text-purple-400'}">3</button>
                  <button onclick="changeStatus('${std.id}', 'srs')" title="Asimilado (SRS)" class="px-1.5 py-0.5 rounded ${std.status === 'srs' ? 'bg-emerald-600 text-white font-bold' : 'text-surface-400 hover:text-emerald-400'}">✓</button>
                </div>

                <svg class="w-3.5 h-3.5 text-surface-400 transition-transform ${isExp ? 'rotate-180' : ''}" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path></svg>
              </div>
            </div>

            <!-- Panel Expandible de Detalles y Acciones SRS -->
            ${isExp ? `
              <div class="px-3 pb-3 pt-2 border-t border-surface-800 bg-surface-950/70 text-xs font-mono space-y-2.5">
                ${std.notes ? `
                  <div class="p-2 rounded bg-surface-900 border border-surface-800 text-[11px] text-surface-300 leading-relaxed">
                    <span class="text-surface-400 block text-[9px] uppercase tracking-wider mb-0.5">Notas Técnicas</span>
                    ${escapeHtml(std.notes)}
                  </div>

                <!-- Si está Asimilado, mostrar acciones directas de Repetición Espaciada -->
                ${std.status === 'srs' ? `
                  <div class="p-2.5 rounded bg-emerald-950/30 border border-emerald-800/40 flex flex-wrap items-center justify-between gap-2">

                      <span class="text-[9px] uppercase tracking-wider text-emerald-400 block">Rueda SRS Activa</span>
                      <span class="text-[11px] text-surface-200">Próximo repaso: <strong class="text-white">${std.nextReview || 'Hoy'}</strong> (Intervalo: ${std.srsInterval || 15} días)</span>
                    </div>
                    <div class="flex items-center gap-2">
                      <button onclick="handleSRSReview('${std.id}', true)" class="tap-active px-2.5 py-1 rounded bg-emerald-900/50 hover:bg-emerald-800/70 border border-emerald-600 text-emerald-200 text-[10px] font-semibold">
                        ✓ Sólido (×2 días)
                      </button>
                      <button onclick="handleSRSReview('${std.id}', false)" class="tap-active px-2.5 py-1 rounded bg-red-950/50 hover:bg-red-900/70 border border-red-700 text-red-200 text-[10px] font-semibold">
                        ✕ Oxidado (Revisar en F3)
                      </button>
                    </div>
                  </div>
                ` : ''}

                <div class="flex items-center justify-between pt-1 text-[11px]">
                  <span class="text-surface-400">Tempo objetivo: ${std.tempo ? `${std.tempo} BPM` : 'No asignado'}</span>
                  <button onclick="openEditModal('${std.id}')" class="text-surface-300 hover:text-white underline">Editar ficha</button>
                </div>
              </div>
            ` : ''}
          </div>
        `;
      }).join('');
    }

    /* =========================================================================
       CONTROLADORES DE ESTADO
       ========================================================================= */
    window.toggleRow = function(id) {
      expandedId = (expandedId === id) ? null : id;
      renderList();
    };

    window.changeStatus = function(id, nextStatus) {
      const std = standards.find(s => s.id === id);
      if (!std) return;

      std.status = nextStatus;
      if (nextStatus === 'srs') {
        std.srsInterval = std.srsInterval || 15;
        std.lastReviewed = getTodayString();
        std.nextReview = addDays(std.lastReviewed, std.srsInterval);
      }
      saveData();
      renderApp();
    };

    window.handleSRSReview = function(id, passed) {
      const std = standards.find(s => s.id === id);
      if (!std) return;

      const today = getTodayString();
      std.lastReviewed = today;

      if (passed) {
        // Multiplicar intervalo por 2 (15 -> 30 -> 60 -> 120 días)
        const current = std.srsInterval || 15;
        std.srsInterval = Math.min(180, Math.round(current * 2));
        std.nextReview = addDays(today, std.srsInterval);
      } else {
        // Degradar a Fase 3 y revisión semanal
        std.status = 'f3';
        std.srsInterval = 7;
        std.nextReview = addDays(today, 7);
      }

      saveData();
      renderApp();
    };

    /* =========================================================================
       RULETAS DE AZAR (ESTUDIO ACTIVO VS EN FRÍO)
       ========================================================================= */
    const rouletteModal = document.getElementById('rouletteModal');
    let currentRouletteGroup = 'study'; // 'study' | 'jam'

    function triggerRoulette(group) {
      currentRouletteGroup = group;
      rouletteModal.classList.remove('hidden');

      const isStudy = group === 'study';
      document.getElementById('rouletteIcon').textContent = isStudy ? '🎲' : '⚡';
      document.getElementById('rouletteTitleHeading').textContent = isStudy 
        ? 'Estudio Activo (Fases 1, 2, 3)' 
        : 'Estudio en Frío (Repertorio Asimilado)';

      rollStandard();
    }

    function rollStandard() {
      let pool = [];
      if (currentRouletteGroup === 'study') {
        pool = standards.filter(s => ['f1', 'f2', 'f3'].includes(s.status));
      } else {
        pool = standards.filter(s => s.status === 'srs');
      }

      const resultBox = document.getElementById('rouletteResultBox');
      const emptyMsg = document.getElementById('rouletteEmptyMsg');

      if (pool.length === 0) {
        resultBox.classList.add('hidden');
        emptyMsg.classList.remove('hidden');
        emptyMsg.textContent = currentRouletteGroup === 'study'
          ? 'No hay temas en Fases 1, 2 o 3. Promueve algunos standards desde Backlog para iniciar el estudio.'
          : 'Aún no tienes standards en el estado Asimilado.';
        return;
      }

      emptyMsg.classList.add('hidden');
      resultBox.classList.remove('hidden');

      const chosen = pool[Math.floor(Math.random() * pool.length)];
      const challenge = STUDY_CHALLENGES[Math.floor(Math.random() * STUDY_CHALLENGES.length)];
      const cfg = STATUS_CONFIG[chosen.status] || STATUS_CONFIG.f0;

      const badge = document.getElementById('roulettePhaseBadge');
      badge.textContent = cfg.label;
      badge.className = `text-[10px] font-mono px-1.5 py-0.5 rounded border ${cfg.badge}`;

      document.getElementById('rouletteStdName').textContent = chosen.title;
      document.getElementById('rouletteKeyPill').textContent = chosen.keyConcert || 'Tono concert';
      document.getElementById('rouletteFormPill').textContent = chosen.form || 'Std';
      document.getElementById('rouletteTempoPill').textContent = chosen.tempo ? `${chosen.tempo} BPM` : 'Tempo libre';
      document.getElementById('rouletteChallenge').textContent = challenge;
    }

    /* =========================================================================
       MODAL DE EDICIÓN / ALTA
       ========================================================================= */
    const detailModal = document.getElementById('detailModal');
    const form = document.getElementById('editStandardForm');
    const btnDelete = document.getElementById('btnDeleteStd');

    function openNewModal() {
      document.getElementById('modalHeadTitle').textContent = 'Nuevo Standard';
      document.getElementById('editId').value = '';
      form.reset();
      document.getElementById('editStatus').value = 'f0';
      btnDelete.classList.add('hidden');
      detailModal.classList.remove('hidden');
      document.getElementById('editTitle').focus();
    }

    window.openEditModal = function(id) {
      const std = standards.find(s => s.id === id);
      if (!std) return;

      document.getElementById('modalHeadTitle').textContent = 'Editar Standard';
      document.getElementById('editId').value = std.id;
      document.getElementById('editTitle').value = std.title || '';
      document.getElementById('editKeyConcert').value = std.keyConcert || '';
      document.getElementById('editKeyTransposed').value = std.keyTransposed || '';
      document.getElementById('editForm').value = std.form || '';
      document.getElementById('editTempo').value = std.tempo || '';
      document.getElementById('editStatus').value = std.status || 'f0';
      document.getElementById('editNotes').value = std.notes || '';

      btnDelete.classList.remove('hidden');
      detailModal.classList.remove('hidden');
    };

    function closeDetailModal() {
      detailModal.classList.add('hidden');
      form.reset();
    }

    form.addEventListener('submit', (e) => {
      e.preventDefault();
      const id = document.getElementById('editId').value;
      const title = document.getElementById('editTitle').value.trim();
      const keyConcert = document.getElementById('editKeyConcert').value.trim();
      const keyTransposed = document.getElementById('editKeyTransposed').value.trim();
      const formVal = document.getElementById('editForm').value.trim();
      const tempo = parseInt(document.getElementById('editTempo').value, 10) || null;
      const status = document.getElementById('editStatus').value;
      const notes = document.getElementById('editNotes').value.trim();

      if (!title || !keyConcert) return;

      if (id) {
        const std = standards.find(s => s.id === id);
        if (std) {
          const wasSrs = std.status === 'srs';
          std.title = title;
          std.keyConcert = keyConcert;
          std.keyTransposed = keyTransposed;
          std.form = formVal;
          std.tempo = tempo;
          std.status = status;
          std.notes = notes;

          if (status === 'srs' && !wasSrs) {
            std.srsInterval = std.srsInterval || 15;
            std.lastReviewed = getTodayString();
            std.nextReview = addDays(std.lastReviewed, std.srsInterval);
          }
        }
      } else {
        const newStd = {
          id: 'std_' + Date.now(),
          title,
          keyConcert,
          keyTransposed,
          form: formVal,
          tempo,
          status,
          notes,
          srsInterval: status === 'srs' ? 15 : 0,
          lastReviewed: status === 'srs' ? getTodayString() : null,
          nextReview: status === 'srs' ? addDays(getTodayString(), 15) : null
        };
        standards.unshift(newStd);
      }

      saveData();
      closeDetailModal();
      renderApp();
    });

    btnDelete.addEventListener('click', () => {
      const id = document.getElementById('editId').value;
      if (!id) return;
      standards = standards.filter(s => s.id !== id);
      if (expandedId === id) expandedId = null;
      saveData();
      closeDetailModal();
      renderApp();
    });

    /* =========================================================================
       IMPORTAR / EXPORTAR JSON & RESET
       ========================================================================= */
    function exportVault() {
      const today = getTodayString();
      const blob = new Blob([JSON.stringify(standards, null, 2)], { type: 'application/json' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `repertorio_standards_${today}.json`;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
    }

    function importVault(e) {
      const file = e.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = (evt) => {
        try {
          const parsed = JSON.parse(evt.target.result);
          if (Array.isArray(parsed)) {
            standards = parsed;
            saveData();
            renderApp();
          }
        } catch (err) {
          console.error('Error importando JSON:', err);
        }
      };
      reader.readAsText(file);
      e.target.value = '';
    }

    function resetToMasterList() {
      standards = MASTER_SEED.map(item => ({
        id: item.id,
        title: item.title,
        keyConcert: item.key,
        keyTransposed: '',
        form: item.form,
        tempo: item.tempo,
        status: 'f0',
        notes: item.notes,
        srsInterval: 0,
        lastReviewed: null,
        nextReview: null
      }));
      saveData();
      renderApp();
    }

    function escapeHtml(str) {
      if (!str) return '';
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;');
    }

    /* =========================================================================
       EVENT LISTENERS
       ========================================================================= */
    document.addEventListener('DOMContentLoaded', () => {
      loadData();
      renderApp();

      // Búsqueda en vivo
      document.getElementById('searchInput').addEventListener('input', (e) => {
        searchQuery = e.target.value;
        renderList();
      });

      // Ordenación
      document.getElementById('sortSelect').addEventListener('change', (e) => {
        sortMode = e.target.value;
        renderList();
      });

      // Filtro de repasos pendientes
      document.getElementById('btnFilterDueToday').addEventListener('click', () => {
        currentFilter = (currentFilter === 'due') ? 'all' : 'due';
        renderApp();
      });

      // Botonera de estudio
      document.getElementById('btnStudyRoll').addEventListener('click', () => triggerRoulette('study'));
      document.getElementById('btnJamRoll').addEventListener('click', () => triggerRoulette('jam'));
      document.getElementById('btnSpinAgain').addEventListener('click', rollStandard);
      document.getElementById('btnCloseRoulette').addEventListener('click', () => rouletteModal.classList.add('hidden'));

      // Modales
      document.getElementById('btnOpenNew').addEventListener('click', openNewModal);
      document.getElementById('btnCloseDetailModal').addEventListener('click', closeDetailModal);
      document.getElementById('btnCancelDetail').addEventListener('click', closeDetailModal);

      // Backup & Reset
      document.getElementById('btnHeaderExport').addEventListener('click', exportVault);
      document.getElementById('headerImportInput').addEventListener('change', importVault);
      document.getElementById('btnExportData').addEventListener('click', exportVault);
      document.getElementById('importFileInput').addEventListener('change', importVault);
      document.getElementById('btnResetVault').addEventListener('click', resetToMasterList);
    });
  </script>
</body>
</html>
